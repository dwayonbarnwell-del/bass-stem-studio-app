function save(){try{localStorage.setItem(APP_KEY,JSON.stringify(state))}catch(e){}}
function wordKey(l,i){return `${l}:${i}`}
function arr(){return WORD_LEVELS[state.level-1]}
function pos(){return Math.max(0,Math.min(999,state.pos[state.level]||0))}
function currentWord(){return arr()[pos()]}

let uiSize=12;try{const n=Number(localStorage.getItem(SIZE_KEY));if(Number.isFinite(n))uiSize=Math.max(12,Math.min(40,Math.round(n)))}catch(e){}
function applySize(){document.documentElement.style.setProperty('--base',uiSize+'px');document.documentElement.dataset.uiScale=uiSize>=30?'xlarge':uiSize>=20?'large':'standard';for(const id of ['sizeCurrent','sizeModalCurrent','topSize']){const e=$(id);if(e)e.textContent=uiSize+' px'}for(const id of ['sizeRange','sizeRange2']){const e=$(id);if(e)e.value=uiSize}}
function setSize(v){uiSize=Math.max(12,Math.min(40,Math.round(Number(v)||12)));try{localStorage.setItem(SIZE_KEY,String(uiSize))}catch(e){}applySize()}
function adjustSize(d){setSize(uiSize+d)}function openSize(){$('sizeModal').classList.add('show')}function closeSize(){$('sizeModal').classList.remove('show')}
applySize();

function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)}
function renderHome(){let html='';for(let l=1;l<=5;l++){const done=state.furthest[l]||0,pct=Math.min(100,done/10);html+=`<button class="level-card" onclick="startLevel(${l})" aria-label="Open Level ${l}"><div class="level-top"><span class="level-name">Level ${l}</span><span class="arrow">›</span></div><div class="mini-progress" aria-hidden="true"><i style="width:${pct}%"></i></div></button>`}$('levelGrid').innerHTML=html}
function startLevel(l){stopSpeech();state.level=Number(l);save();$('home').classList.remove('active');$('reader').classList.add('active');renderReader();window.scrollTo(0,0)}
function goHome(){stopSpeech();$('reader').classList.remove('active');$('home').classList.add('active');renderHome();window.scrollTo(0,0)}
function renderLevelSelect(){const opts=Array.from({length:5},(_,i)=>`<option value="${i+1}" ${state.level===i+1?'selected':''}>Level ${i+1}</option>`).join('');$('levelSelect').innerHTML=opts}
function changeLevel(v){stopSpeech();state.level=Math.max(1,Math.min(5,Number(v)||1));save();renderReader();window.scrollTo(0,0)}

function fitActionButtons(){
  const buttons=[...document.querySelectorAll('.action-btn')];
  buttons.forEach(btn=>btn.classList.remove('icon-only'));
  requestAnimationFrame(()=>{
    buttons.forEach(btn=>{
      const icon=btn.querySelector('.action-icon');
      const copy=btn.querySelector('.action-copy');
      if(!icon||!copy)return;
      const style=getComputedStyle(btn);
      const pad=(parseFloat(style.paddingLeft)||0)+(parseFloat(style.paddingRight)||0);
      const gap=parseFloat(getComputedStyle(btn).columnGap)||0;
      const needed=icon.getBoundingClientRect().width+copy.scrollWidth+gap;
      const available=btn.clientWidth-pad;
      if(needed>available+0.5)btn.classList.add('icon-only');
    });
  });
}
function renderReader(){renderLevelSelect();const i=pos(),w=currentWord(),key=wordKey(state.level,i),status=state.known[key]?'Known':state.practice[key]?'Practice':'New';$('readerSubtitle').textContent=`${i+1} / 1,000`; $('progressFill').style.width=((i+1)/10)+'%';$('content').innerHTML=`<div class="card word-card"><div class="word-head"><div class="badge">${esc(status)}</div></div><div class="pron-row"><button class="btn tone-blue action-btn" onclick="speakWord(false)" aria-label="Hear word" title="Hear word"><span class="action-icon">🔊</span><span class="action-copy"><span>Hear</span><span>word</span></span></button><button class="btn tone-teal action-btn" onclick="speakWord(true)" aria-label="Hear slowly" title="Hear slowly"><span class="action-icon">🐢</span><span class="action-copy"><span>Hear</span><span>slowly</span></span></button><button class="btn tone-indigo action-btn" onclick="practiceWord()" aria-label="Say and check" title="Say and check"><span class="action-icon">🎙</span><span class="action-copy"><span>Say</span><span>&amp; check</span></span></button><button class="btn tone-slate action-btn" onclick="openJump()" aria-label="Find word" title="Find word"><span class="action-icon">🔎</span><span class="action-copy"><span>Find</span><span>word</span></span></button></div><div class="word">${esc(w)}</div><div id="speechFb"></div><div class="meaning-card"><div class="meaning-title"><strong>Meaning</strong></div><div id="meaningBody" class="meaning-body"><div class="meaning-status">Loading meaning…</div></div><div class="meaning-action-row"><button class="btn tone-cyan action-btn" id="hearMeaningBtn" onclick="hearMeaning()" aria-label="Hear meaning" title="Hear meaning" disabled><span class="action-icon">🔊</span><span class="action-copy"><span>Hear</span><span>meaning</span></span></button><button class="btn tone-purple action-btn" onclick="reloadMeaning()" aria-label="Refresh meaning" title="Refresh meaning"><span class="action-icon">↻</span><span class="action-copy one-line"><span>Refresh</span></span></button><button class="btn tone-green action-btn" onclick="markKnown()" aria-label="I know this word" title="I know this word"><span class="action-icon">✓</span><span class="action-copy one-line"><span>Know it</span></span></button><button class="btn tone-amber action-btn" onclick="markPractice()" aria-label="Practise again" title="Practise again"><span class="action-icon">↻</span><span class="action-copy one-line"><span>Practise</span></span></button></div></div><div class="nav"><button class="btn tone-nav" onclick="prevWord()">‹ Previous</button><button class="btn tone-nav" onclick="nextWord()">Next ›</button></div><div class="meta"><span id="voiceLabel">Voice</span></div></div>`;updateVoiceLabel();fitActionButtons();loadMeaning(w);prefetchNearby();}
function setIndex(i){state.pos[state.level]=Math.max(0,Math.min(999,i));state.furthest[state.level]=Math.max(state.furthest[state.level]||0,state.pos[state.level]+1);save();renderReader();window.scrollTo({top:0,behavior:'smooth'})}
function nextWord(){stopSpeech();setIndex(pos()+1)}function prevWord(){stopSpeech();setIndex(pos()-1)}
function markKnown(){const k=wordKey(state.level,pos());state.known[k]=1;delete state.practice[k];save();toast('Marked as known');if(pos()<999)setIndex(pos()+1);else renderReader()}
function markPractice(){const k=wordKey(state.level,pos());state.practice[k]=1;delete state.known[k];save();toast('Added to practice');if(pos()<999)setIndex(pos()+1);else renderReader()}

function bestVoice(){const vs=speechSynthesis.getVoices?.()||[];return vs.find(v=>/^en-GB$/i.test(v.lang))||vs.find(v=>/^en-GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||vs[0]||null}
function updateVoiceLabel(){const e=$('voiceLabel');if(!e||!('speechSynthesis'in window))return;const v=bestVoice();e.textContent=v?`Voice: ${String(v.lang||'en').replace('-',' ')}`:'Voice unavailable'}
if('speechSynthesis'in window)speechSynthesis.onvoiceschanged=updateVoiceLabel;
function stopSpeech(){try{speechSynthesis.cancel()}catch(e){}}
function speakText(t,rate=.82){if(!('speechSynthesis'in window)){toast('Speech is not supported by this browser');return}stopSpeech();const u=new SpeechSynthesisUtterance(String(t));const v=bestVoice();if(v)u.voice=v;u.lang=v?.lang||'en-GB';u.rate=rate;u.pitch=1;speechSynthesis.speak(u)}
function speakWord(slow){speakText(currentWord(),slow?.58:.78)}

function SR(){return window.SpeechRecognition||window.webkitSpeechRecognition||null}
function normaliseSpeech(s){return String(s||'').toLowerCase().replace(/[^a-z]/g,'')}
function similarity(a,b){a=normaliseSpeech(a);b=normaliseSpeech(b);if(!a&&!b)return 100;if(!a||!b)return 0;const m=a.length,n=b.length,dp=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){let prev=dp[0];dp[0]=i;for(let j=1;j<=n;j++){const tmp=dp[j];dp[j]=Math.min(dp[j]+1,dp[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=tmp}}return Math.max(0,Math.round((1-dp[n]/Math.max(m,n))*100))}
function recognise(){return new Promise((resolve,reject)=>{const R=SR();if(!R)return reject(new Error('Speech checking is not supported by this browser.'));const r=new R();r.lang='en-GB';r.interimResults=false;r.maxAlternatives=3;r.onresult=e=>resolve(Array.from(e.results[0]).map(x=>x.transcript).join(' | '));r.onerror=e=>reject(new Error(e.error||'Recognition failed'));r.onend=()=>{};try{r.start()}catch(e){reject(e)}})}
async function practiceWord(){const el=$('speechFb');el.innerHTML='<div class="feedback"><strong>Listening…</strong></div>';try{const said=await recognise();const candidates=said.split('|').map(x=>x.trim()),scores=candidates.map(x=>similarity(currentWord(),x)),best=Math.max(...scores),bestText=candidates[scores.indexOf(best)]||said,cls=best>=88?'good':best>=65?'warn':'bad';el.innerHTML=`<div class="feedback ${cls}"><strong>${best}% match</strong><div>The device heard: ${esc(bestText)}</div></div>`}catch(e){el.innerHTML=`<div class="feedback bad"><strong>Could not check</strong><div>${esc(e.message)}</div></div>`}}

let currentMeaning=null,currentMeaningWord='';
function cacheGet(word){try{const x=localStorage.getItem(DEF_PREFIX+word);return x?JSON.parse(x):null}catch(e){return null}}
function cacheSet(word,data){try{localStorage.setItem(DEF_PREFIX+word,JSON.stringify(data))}catch(e){}}
function cleanText(s){return String(s||'').replace(/\s+/g,' ').trim()}
function posName(p){p=String(p||'').toLowerCase();if(p==='n'||p.includes('noun'))return'Noun';if(p==='v'||p.includes('verb'))return'Verb';if(p==='a'||p==='s'||p.includes('adj'))return'Adjective';if(p==='r'||p.includes('adv'))return'Adverb';return p?String(p):''}
function plainHtml(s){const d=document.createElement('div');d.innerHTML=String(s||'');return cleanText(d.textContent||d.innerText||'')}
const OPEN_DICT_BUCKETS={};
const LOCAL_MEANINGS={
  flamboyancy:{senses:[{pos:'Noun',def:'The quality or state of being flamboyant; a showy or striking style, appearance or behaviour.',example:''}],synonyms:[],source:'Built-in'},
  hybridization:{senses:[{pos:'Noun',def:'The act or process of forming a hybrid by combining different varieties, species, ideas or systems.',example:''},{pos:'Noun',def:'In chemistry, the mixing of atomic orbitals to form new hybrid orbitals.',example:''}],synonyms:[],source:'Built-in'},
  astrosphere:{senses:[{pos:'Noun',def:'The region around a star that is shaped and influenced by the star’s wind and its interaction with surrounding interstellar material.',example:''}],synonyms:[],source:'Built-in'}
};
function lookupLocal(word){const d=LOCAL_MEANINGS[String(word||'').toLowerCase()];if(!d)throw new Error('No built-in definition');return Promise.resolve(d)}
async function lookupDatamuse(word){const r=await fetch('https://api.datamuse.com/words?sp='+encodeURIComponent(word)+'&md=d&max=3',{headers:{'Accept':'application/json'}});if(!r.ok)throw new Error('Datamuse '+r.status);const data=await r.json();const target=String(word||'').toLowerCase();const item=(Array.isArray(data)?data:[]).find(x=>String(x?.word||'').toLowerCase()===target)||(Array.isArray(data)?data[0]:null);const defs=Array.isArray(item?.defs)?item.defs:[];const senses=[];for(const raw of defs){const parts=String(raw).split('\t'),tag=parts.shift()||'',def=cleanText(parts.join(' '));if(def)senses.push({pos:posName(tag),def,example:''});if(senses.length>=2)break}if(!senses.length)throw new Error('No Datamuse definition');return{senses,synonyms:[],source:'Dictionary'}}

async function lookupOpenDictionary(word){const w=String(word||'').toLowerCase(),a=w.slice(0,1),b=w.slice(0,2)||a;if(!a)throw new Error('No word');const key=a+'/'+b;if(!OPEN_DICT_BUCKETS[key])OPEN_DICT_BUCKETS[key]=fetch(`https://raw.githubusercontent.com/mhollingshead/open-dictionary/main/api/${a}/${b}.json`).then(r=>{if(!r.ok)throw new Error('Open Dictionary '+r.status);return r.json()}).catch(e=>{delete OPEN_DICT_BUCKETS[key];throw e});const bucket=await OPEN_DICT_BUCKETS[key],entry=bucket?.[w],senses=[];for(const et of entry?.etymologies||[]){for(const part of et?.partsOfSpeech||[]){const pos=posName(part?.partOfSpeech||'');for(const s of part?.senses||[]){const def=plainHtml(s?.sense||'');if(!def)continue;const examples=Array.isArray(s?.examples)?s.examples.map(plainHtml).filter(Boolean):[];senses.push({pos,def,example:examples[0]||''});if(senses.length>=2)break}if(senses.length>=2)break}if(senses.length>=2)break}if(!senses.length)throw new Error('No Open Dictionary definition');return{senses,synonyms:[],source:'Open Dictionary'}}

async function lookupWiktionary(word){const r=await fetch('https://en.wiktionary.org/api/rest_v1/page/definition/'+encodeURIComponent(word),{headers:{'Accept':'application/json'}});if(!r.ok)throw new Error('Wiktionary '+r.status);const data=await r.json(),entries=Array.isArray(data?.en)?data.en:[],senses=[];for(const entry of entries){const pos=posName(entry?.partOfSpeech||'');for(const d of entry?.definitions||[]){const def=plainHtml(d?.definition||'');if(!def)continue;const examples=Array.isArray(d?.examples)?d.examples.map(plainHtml).filter(Boolean):[];senses.push({pos,def,example:examples[0]||''});if(senses.length>=2)break}if(senses.length>=2)break}if(!senses.length)throw new Error('No Wiktionary definition');return{senses, synonyms:[],source:'Wiktionary'}}

function unique(a){return [...new Set(a.filter(Boolean).map(cleanText).filter(Boolean))]}
function extractOEWN(data,word){const senses=[],defs=[],examples=[],syns=[],pos=[];const seen=new Set();function walk(x,depth=0){if(depth>12||x==null)return;if(Array.isArray(x)){for(const y of x)walk(y,depth+1);return}if(typeof x!=='object')return;let localDef=null,localPos='',localEx=[];for(const [k,v] of Object.entries(x)){const kl=k.toLowerCase();if((kl==='definition'||kl==='gloss')&&typeof v==='string')localDef=cleanText(v);if((kl==='pos'||kl==='partofspeech'||kl==='part_of_speech')&&(typeof v==='string'))localPos=posName(v);if((kl==='example'||kl==='examples')){if(typeof v==='string')localEx.push(cleanText(v));else if(Array.isArray(v))localEx.push(...v.filter(z=>typeof z==='string').map(cleanText))}if((kl==='lemma'||kl==='lemmas'||kl==='members'||kl==='words')&&Array.isArray(v))syns.push(...v.filter(z=>typeof z==='string'));}if(localDef){const key=localPos+'|'+localDef;if(!seen.has(key)){seen.add(key);senses.push({pos:localPos,def:localDef,example:localEx[0]||''})}}for(const [k,v] of Object.entries(x)){if(typeof v==='object')walk(v,depth+1);else if(typeof v==='string'){const kl=k.toLowerCase();if(kl==='definition'||kl==='gloss')defs.push(v);if(kl==='example')examples.push(v);if(kl==='pos'||kl==='partofspeech'||kl==='part_of_speech')pos.push(posName(v))}}}walk(data);if(!senses.length){const dd=unique(defs).slice(0,3);for(let i=0;i<dd.length;i++)senses.push({pos:unique(pos)[i]||unique(pos)[0]||'',def:dd[i],example:unique(examples)[i]||''})}return{senses:senses.slice(0,3),synonyms:unique(syns).filter(s=>s.toLowerCase()!==String(word||'').toLowerCase()).slice(0,8),source:'Open English WordNet'}}
async function lookupOEWN(word){const r=await fetch('https://en-word.net/json/lemma/'+encodeURIComponent(word),{headers:{'Accept':'application/json'}});if(!r.ok)throw new Error('OEWN '+r.status);const data=await r.json();const parsed=extractOEWN(data,word);if(!parsed.senses.length)throw new Error('No OEWN definition');return parsed}
async function lookupFallback(word){const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(word));if(!r.ok)throw new Error('Dictionary '+r.status);const data=await r.json();const senses=[],syn=[];for(const entry of Array.isArray(data)?data:[]){for(const m of entry.meanings||[]){for(const d of m.definitions||[]){if(d.definition)senses.push({pos:posName(m.partOfSpeech),def:cleanText(d.definition),example:cleanText(d.example||'')});if(senses.length>=3)break}syn.push(...(m.synonyms||[]));if(senses.length>=3)break}if(senses.length>=3)break}if(!senses.length)throw new Error('No fallback definition');return{senses, synonyms:unique(syn).slice(0,8),source:'Dictionary API'}}
async function resolveMeaning(word,force=false){try{return await lookupLocal(word)}catch(e){}if(!force){const c=cacheGet(word);if(c&&c.senses?.length)return c}let lastErr='';for(const lookup of [lookupOpenDictionary,lookupWiktionary,lookupDatamuse,lookupOEWN,lookupFallback]){try{const d=await lookup(word);cacheSet(word,d);return d}catch(e){lastErr=e?.message||lastErr}}return{senses:[],synonyms:[],source:'',error:lastErr||'No meaning found'}}
function meaningHtml(data,word){if(!data||!data.senses?.length)return `<div class="meaning-error"><strong>Meaning unavailable.</strong> Tap Refresh.</div>`;let h='<div class="sense-list">';data.senses.slice(0,2).forEach((s,i)=>{h+=`<div class="sense">${s.pos?`<span class="pos">${esc(s.pos)}</span>`:''}<span class="meaning-main">${esc(s.def)}</span></div>`});h+='</div>';return h}
async function loadMeaning(word,force=false){currentMeaning=null;currentMeaningWord=word;const body=$('meaningBody');const src=$('meaningSource');const hear=$('hearMeaningBtn');if(body)body.innerHTML='<div class="meaning-status">Loading meaning…</div>';if(src)src.textContent='Loading…';if(hear)hear.disabled=true;const d=await resolveMeaning(word,force);if(currentWord()!==word)return;currentMeaning=d;if(body)body.innerHTML=meaningHtml(d,word);if(src)src.textContent='';if(hear)hear.disabled=!d.senses?.length}
function reloadMeaning(){try{localStorage.removeItem(DEF_PREFIX+currentWord())}catch(e){}loadMeaning(currentWord(),true)}
function hearMeaning(){if(!currentMeaning?.senses?.length)return;const s=currentMeaning.senses[0];speakText(`${currentWord()}. ${s.pos? s.pos+'. ':''}${s.def}`,.78)}
function prefetchNearby(){const a=arr(),i=pos();[i+1,i+2].filter(j=>j<a.length).forEach(j=>{const w=a[j];if(!cacheGet(w))setTimeout(()=>resolveMeaning(w).catch(()=>{}),500+(j-i)*300)})}

function openJump(){const opts=Array.from({length:5},(_,i)=>`<option value="${i+1}" ${state.level===i+1?'selected':''}>Level ${i+1}</option>`).join('');$('jumpLevel').innerHTML=opts;$('jumpNumber').value=pos()+1;$('searchWord').value='';$('jumpModal').classList.add('show')}function closeJump(){$('jumpModal').classList.remove('show')}
function jumpLevelChanged(v){state.level=Math.max(1,Math.min(5,Number(v)||1));save();$('jumpNumber').value=pos()+1}
function jumpToNumber(){const n=Math.max(1,Math.min(1000,Number($('jumpNumber').value)||1));closeJump();$('home').classList.remove('active');$('reader').classList.add('active');setIndex(n-1)}
function searchCurrentLevel(){const q=String($('searchWord').value||'').trim().toLowerCase();if(!q)return;const a=WORD_LEVELS[state.level-1],exact=a.indexOf(q),partial=exact>=0?exact:a.findIndex(w=>w.startsWith(q)||w.includes(q));if(partial<0){toast('No match in this level');return}closeJump();$('home').classList.remove('active');$('reader').classList.add('active');setIndex(partial)}

document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeJump();closeSize();return}if(!$('reader').classList.contains('active'))return;if(['INPUT','SELECT'].includes(document.activeElement?.tagName))return;if(e.key==='ArrowRight')nextWord();else if(e.key==='ArrowLeft')prevWord();else if(e.key===' '){e.preventDefault();speakWord(false)}});
window.addEventListener('resize',fitActionButtons);window.addEventListener('orientationchange',fitActionButtons);window.addEventListener('pagehide',stopSpeech);renderHome();
</script>

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
