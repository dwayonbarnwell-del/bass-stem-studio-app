<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09182b">
<title>Rapid Word Recognition · Speak & Read Learning Hub</title>
<style>

:root{
  --navy:#0b2b46;--navy2:#145079;--ink:#12202b;--muted:#5b6b78;--bg:#f3f7f8;
  --card:#ffffff;--line:#d7e1e6;--accent:#1985c4;--accent-soft:#e8f3fb;--accent-soft-2:#d6e8f7;
  --good:#2f7d64;--focus:#0a67a3;--shadow:0 12px 34px rgba(19,48,68,.12);--ui-base:12px;
}
*{box-sizing:border-box}
html{font-size:var(--ui-base);-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Arial,"Helvetica Neue",sans-serif;line-height:1.45}
body,button,input,select{font-size:1rem}
button,input,select{font:inherit;color:inherit}
a{text-decoration:none;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:.24rem solid var(--focus);outline-offset:.16rem}
.app{min-height:100dvh}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.8rem;padding:.8rem 1rem;background:rgba(11,43,70,.98);color:#fff;border-bottom:1px solid rgba(255,255,255,.15)}
.mark{width:3rem;height:3rem;border-radius:.85rem;background:linear-gradient(145deg,#76b9ec,#3a7fb7);display:grid;place-items:center;font-weight:950;font-size:1rem;flex:0 0 auto}
.brand{font-size:1.35rem;font-weight:950;letter-spacing:-.02em;min-width:0}
main{width:min(74rem,100%);margin:0 auto;padding:1.4rem 1rem 4rem}
.screen{display:none}.screen.active{display:block}
h1{font-size:2rem;line-height:1.1;margin:0 0 .45rem}
h2{font-size:1.35rem;line-height:1.2;margin:0 0 .55rem}
.sub{color:var(--muted);font-size:1rem;margin:0 0 1rem}
.card,.rapid-card,.reader-head,.level-strip,.sheet{background:var(--card);border:1px solid var(--line);border-radius:1.25rem;box-shadow:var(--shadow)}
.hero{display:grid;gap:.85rem;background:linear-gradient(135deg,#0d3454,#145079);color:#fff;border-radius:1.3rem;padding:1.25rem;box-shadow:var(--shadow);margin-bottom:1rem}
.hero .sub{color:#d7e8f4;margin-bottom:0}
.stat-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.85rem}
.stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:1rem;padding:.85rem;text-align:center}
.stat strong{display:block;font-size:1.35rem;line-height:1.15}.stat span{color:#d8e8f2;font-size:.9rem}
.rule-note{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:1rem;padding:.9rem 1rem;color:#eef6fb}
.rule-note strong{color:#fff}
.size-card{padding:1rem;margin:1rem 0}
.size-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:.75rem;flex-wrap:wrap}
.size-current{font-size:1.25rem;font-weight:950;color:var(--accent);white-space:nowrap}
.size-row{display:grid;grid-template-columns:3.25rem minmax(8rem,1fr) 3.25rem;align-items:center;gap:.7rem}
.size-btn,.control-btn,.back,.home-btn,.jump-btn,.close{min-height:3.1rem;border:1px solid #c2d3de;background:#f7fafb;border-radius:.85rem;font-weight:900}
.size-btn,.control-btn,.close{min-width:3.1rem}
.size-range,.range{width:100%;accent-color:var(--accent)}
.size-range{height:2.3rem}.range{height:2.1rem;margin-top:.25rem}
.size-scale{display:flex;justify-content:space-between;color:var(--muted);font-size:.8rem;margin-top:.2rem}
.level-heading{display:flex;align-items:end;justify-content:space-between;gap:1rem;margin:1.2rem 0 .8rem}
.level-heading p{margin:0;color:var(--muted)}
.level-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.8rem}
.level-card{min-width:0;border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:1rem;background:var(--card);padding:1rem;text-align:left;color:var(--ink);box-shadow:var(--shadow)}
.level-card:hover{border-color:#9fc4de}.level-top{display:flex;align-items:center;justify-content:space-between;gap:.5rem}.level-name{font-size:1.2rem;font-weight:950}.arrow{font-size:1.4rem;color:var(--muted)}
.level-count,.level-progress{color:var(--muted);margin-top:.35rem}
.mini-progress,.progress-line{overflow:hidden;background:#eef4f7;border:1px solid #d7e1e6;border-radius:999px}
.mini-progress{height:.6rem;margin-top:.7rem}.mini-progress i,.progress-line i{display:block;height:100%;background:var(--accent);width:0}
.reader-head{display:block;margin-bottom:.75rem;padding:.8rem 1rem}
.back{width:3.1rem;padding:0;font-size:1.5rem}
.home-btn{padding:.55rem .95rem}
.reader-title{min-width:0}.reader-title strong{font-size:1.35rem;display:block}.reader-title span{color:var(--muted)}
.level-strip{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.65rem;align-items:center;margin-bottom:.75rem;padding:.75rem .9rem}
.level-strip label,.label{font-weight:950;color:#23465d}
.level-select,.input,.select{width:100%;min-width:0;min-height:3.05rem;border:1px solid #c2d3de;background:#fff;border-radius:.8rem;padding:.55rem .8rem;font-weight:850}
.jump-btn{padding:.55rem .95rem;background:#eef5fa}
.progress-line{height:.72rem;margin-bottom:1rem}
.rapid-card{padding:1rem 1rem 1.1rem}
.rapid-display{min-height:13.5rem;display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid #d9e6ef;background:linear-gradient(180deg,#f8fbfd,#edf5fb);border-radius:1rem;padding:1.2rem;font-size:3rem;line-height:1.14;font-weight:950;overflow-wrap:anywhere;color:#10202b}
.rapid-meta{display:flex;justify-content:space-between;gap:.8rem;color:var(--muted);margin:.8rem 0 0;flex-wrap:wrap}
.control-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1rem}
.control-block{background:#f9fbfc;border:1px solid #dbe6ec;border-radius:1rem;padding:1rem;min-width:0}
.wpm-row{display:grid;grid-template-columns:3.1rem minmax(0,1fr) 3.1rem;gap:.6rem;align-items:center}
.wpm-value{text-align:center;font-weight:950;color:var(--accent);font-size:1.05rem}
.presets,.chunks{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.45rem;margin-top:.6rem}
.presets button,.chunks button{min-height:2.9rem;border:1px solid #c6d5df;background:#fff;border-radius:.75rem;font-weight:900;min-width:0;padding:.4rem;color:#234}
.presets button.active,.chunks button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.help{color:var(--muted);font-size:.9rem;margin-top:.55rem}
.playback-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.45rem;margin-bottom:.55rem}.utility-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.45rem;margin-bottom:.85rem}
.btn{min-height:2.7rem;border:0;border-radius:.72rem;padding:.42rem .45rem;font-weight:900;background:var(--accent);color:#fff;line-height:1.15}
.btn.secondary{background:#2f7d64;color:#fff}.btn.ghost{background:#fff;border:1px solid #c2d3de;color:#123}.btn.nav{background:#eef5fa;border:1px solid #c2d3de;color:#123}.btn.stop{background:#5d6b75;color:#fff}.btn:disabled{opacity:.48;cursor:not-allowed}
.modal{position:fixed;inset:0;background:rgba(5,20,31,.58);display:none;align-items:flex-end;justify-content:center;z-index:60}.modal.show{display:flex}
.sheet{width:min(40rem,100%);max-height:90dvh;overflow:auto;padding:1.1rem 1rem max(1.3rem,env(safe-area-inset-bottom))}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:.8rem;margin-bottom:1rem}.sheet-head strong{font-size:1.3rem}
.field{margin-bottom:.9rem}.field label{display:block;font-weight:900;margin-bottom:.4rem}.search-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.6rem}
.toast{position:fixed;left:1rem;right:1rem;bottom:1rem;z-index:80;background:#12374f;color:#fff;border-radius:.85rem;padding:.85rem 1rem;display:none;box-shadow:var(--shadow)}
.hub-home-link{min-height:2.9rem;display:inline-flex;align-items:center;justify-content:center;padding:.45rem .85rem;border:1px solid rgba(255,255,255,.26);border-radius:.8rem;background:#154567;color:#fff;font-weight:900;white-space:nowrap;margin-left:auto}
.hub-home-link:hover{background:#19527b}
@media(max-width:980px){.level-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.stat-row{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:720px){main{padding:1rem .75rem 3rem}.topbar{padding:.7rem .8rem}.level-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.control-grid{grid-template-columns:1fr}.rapid-display{min-height:12rem;font-size:2.55rem}.reader-head{grid-template-columns:auto minmax(0,1fr)}.home-btn{grid-column:1/-1;width:100%}.level-strip{grid-template-columns:1fr}.jump-btn{width:100%}.action-grid{grid-template-columns:1fr 1fr}.presets{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:450px){.brand{font-size:1.08rem}.level-grid{grid-template-columns:1fr}.stat-row{grid-template-columns:1fr 1fr}.search-row{grid-template-columns:1fr}.playback-row{grid-template-columns:repeat(5,minmax(0,1fr));gap:.32rem}.utility-row{grid-template-columns:repeat(3,minmax(0,1fr));gap:.4rem}.playback-row .btn{font-size:.86rem;padding:.35rem .18rem}.utility-row .btn{font-size:.9rem;padding:.4rem .25rem}.chunks{grid-template-columns:repeat(5,minmax(0,1fr))}.rapid-display{padding:.8rem;min-height:10rem;font-size:2.15rem}.hub-home-link{padding:.42rem .64rem}}
html[data-ui-scale="large"] .level-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
html[data-ui-scale="xlarge"] .level-grid,html[data-ui-scale="xlarge"] .stat-row,html[data-ui-scale="xlarge"] .control-grid,html[data-ui-scale="xlarge"] .level-strip{grid-template-columns:1fr}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

</style>

<body>
<div class="app">
<header class="topbar"><div class="mark">RW</div><div class="brand" style="flex:1">Rapid Word Recognition</div><a class="hub-home-link" href="./index.html" aria-label="Back to Learning Hub">Hub</a></header>
<main>
<section id="home" class="screen active">
  <div class="hero card">
    <div><h1>Rapid Word Recognition</h1><p class="sub">Build faster visual recognition with a progressive 10-level word bank.</p></div>
    <div class="stat-row">
      <div class="stat"><strong>10,000</strong><span>unique words</span></div>
      <div class="stat"><strong>10</strong><span>levels</span></div>
      <div class="stat"><strong>1,000</strong><span>words per level</span></div>
      <div class="stat"><strong>7+</strong><span>letters per word</span></div>
    </div>
  </div>

  <div class="card size-card">
    <div class="size-head"><div><h2>Text size</h2></div><div class="size-current" id="sizeCurrent">12 px</div></div>
    <div class="size-row">
      <button class="size-btn" type="button" onclick="adjustSize(-1)" aria-label="Decrease text size">A−</button>
      <input id="sizeRange" class="size-range" type="range" min="12" max="40" step="1" value="12" oninput="setSize(this.value)" aria-label="Text size from 12 to 40 pixels">
      <button class="size-btn" type="button" onclick="adjustSize(1)" aria-label="Increase text size">A+</button>
    </div>
    <div class="size-scale"><span>12 px</span><span>40 px</span></div>
  </div>

  <div class="level-heading"><div><h2 style="margin:0">Choose a level</h2></div></div>
  <div class="level-grid" id="levelGrid"></div>
</section>

<section id="reader" class="screen">
  <div class="reader-head">
    <div class="reader-title"><strong>Rapid Word Recognition</strong><span id="readerSubtitle">Level 1</span></div>
  </div>
  <div class="level-strip">
    <label for="levelSelect">Level</label>
    <select id="levelSelect" class="level-select" onchange="changeLevel(this.value)"></select>
  </div>
  <div class="progress-line" aria-label="Level progress"><i id="progressFill"></i></div>
  <div id="rapidContent"></div>
</section>
</main>
</div>

<div id="jumpModal" class="modal" role="dialog" aria-modal="true" aria-hidden="true" onclick="if(event.target===this)closeJump()">
  <div class="sheet">
    <div class="sheet-head"><strong>Jump to word</strong><button class="close" type="button" onclick="closeJump()" aria-label="Close">×</button></div>
    <div class="field"><label for="jumpLevel">Level</label><select id="jumpLevel" class="select" onchange="jumpLevelChanged(this.value)"></select></div>
    <div class="field"><label for="jumpNumber">Word number</label><div class="search-row"><input id="jumpNumber" class="input" type="number" inputmode="numeric" min="1" max="1000" placeholder="1 to 1000"><button class="btn secondary" type="button" onclick="jumpByNumber()">Go</button></div></div>
    <div class="field"><label for="searchWord">Search this level</label><div class="search-row"><input id="searchWord" class="input" type="search" placeholder="Type a word"><button class="btn secondary" type="button" onclick="findWord()">Find</button></div></div>
    <button class="btn ghost" style="width:100%" type="button" onclick="closeJump()">Close</button>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

const LEVEL_COUNT=10, WORDS_PER_LEVEL=1000;
const APP_KEY='dw-rapid-word-recognition-10000-v1';
const SIZE_KEY='dw-rapid-word-recognition-size-v1';

let state={level:1,pos:Array(11).fill(0),furthest:Array(11).fill(0),wpm:250,chunk:1};
try{
  const saved=JSON.parse(localStorage.getItem(APP_KEY)||'null');
  if(saved&&typeof saved==='object'){
    if(Number.isInteger(saved.level)&&saved.level>=1&&saved.level<=10)state.level=saved.level;
    if(Array.isArray(saved.pos))for(let i=1;i<=10;i++)state.pos[i]=Math.max(0,Math.min(999,Number(saved.pos[i])||0));
    if(Array.isArray(saved.furthest))for(let i=1;i<=10;i++)state.furthest[i]=Math.max(0,Math.min(1000,Number(saved.furthest[i])||0));
    state.wpm=Math.max(100,Math.min(1000,Number(saved.wpm)||250));
    state.chunk=Math.max(1,Math.min(5,Number(saved.chunk)||1));
  }
}catch(e){}
function save(){try{localStorage.setItem(APP_KEY,JSON.stringify(state))}catch(e){}}
function $(id){return document.getElementById(id)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(msg){const t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(t._x);t._x=setTimeout(()=>t.style.display='none',2600)}

/* 12 px is the first-use default. User changes are remembered. */
let textSize=12;
try{const n=Number(localStorage.getItem(SIZE_KEY));if(Number.isFinite(n)&&n>=12&&n<=40)textSize=Math.round(n)}catch(e){}
function applySize(){
  document.documentElement.style.setProperty('--ui-base',textSize+'px');
  document.documentElement.dataset.uiScale=textSize>=30?'xlarge':textSize>=20?'large':'standard';
  const r=$('sizeRange'),c=$('sizeCurrent');if(r)r.value=textSize;if(c)c.textContent=textSize+' px';
}
function setSize(v){let n=Math.round(Number(v));if(!Number.isFinite(n))return;n=Math.max(12,Math.min(40,n));textSize=n;try{localStorage.setItem(SIZE_KEY,String(n))}catch(e){}applySize()}
function adjustSize(d){setSize(textSize+d)}
applySize();

function levelWords(l=state.level){return WORD_LEVELS[l-1]||[]}
function currentPos(){return state.pos[state.level]||0}
function setPos(n){const arr=levelWords();n=Math.max(0,Math.min(arr.length-1,Number(n)||0));state.pos[state.level]=n;state.furthest[state.level]=Math.max(state.furthest[state.level]||0,Math.min(arr.length,n+1));save()}
function currentWords(){const arr=levelWords(),i=currentPos(),out=[];for(let j=0;j<state.chunk;j++)out.push(arr[(i+j)%arr.length]);return out}

function renderHome(){
  const g=$('levelGrid');
  g.innerHTML=Array.from({length:10},(_,i)=>{
    const l=i+1,done=Math.min(1000,state.furthest[l]||0),pct=done/10;
    return `<button class="level-card" type="button" onclick="startLevel(${l})"><div class="level-top"><span class="level-name">Level ${l}</span><span class="arrow">›</span></div><div class="level-count">1,000 words · 7+ letters</div><div class="mini-progress"><i style="width:${pct}%"></i></div><div class="level-progress">${done.toLocaleString()} / 1,000 reached</div></button>`;
  }).join('');
  applySize();
}
function startLevel(l){rapidPause();state.level=Number(l);save();$('home').classList.remove('active');$('reader').classList.add('active');renderReader();window.scrollTo(0,0)}
function goHome(){rapidPause();$('reader').classList.remove('active');$('home').classList.add('active');renderHome();window.scrollTo(0,0)}
function renderLevelSelect(){
  const opts=Array.from({length:10},(_,i)=>`<option value="${i+1}" ${state.level===i+1?'selected':''}>Level ${i+1} · 1,000 words</option>`).join('');
  $('levelSelect').innerHTML=opts;
}
function changeLevel(v){rapidPause();const l=Number(v);if(l<1||l>10)return;state.level=l;save();renderReader();window.scrollTo({top:0,behavior:'smooth'})}
function move(d){rapidPause();const n=levelWords().length;let p=(currentPos()+d+n)%n;setPos(p);renderReader()}

function renderReader(){
  const arr=levelWords(),i=currentPos();
  renderLevelSelect();
  $('readerSubtitle').textContent=`Level ${state.level} · ${i+1} of ${arr.length}`;
  $('progressFill').style.width=((i+1)/arr.length*100)+'%';
  $('rapidContent').innerHTML=renderRapid();
  updatePlaybackButtons();
  save();
}
function renderRapid(){
  const w=state.wpm,c=state.chunk,i=currentPos(),arr=levelWords(),words=currentWords();
  return `<div class="rapid-card">
    <div class="playback-row">
      <button class="btn" id="playBtn" type="button" onclick="rapidPlay()">▶ Play</button>
      <button class="btn ghost" id="pauseBtn" type="button" onclick="rapidPause()">Ⅱ Pause</button>
      <button class="btn stop" id="stopBtn" type="button" onclick="rapidStop()">■ Stop</button>
      <button class="btn nav" type="button" onclick="move(-1)">‹ Previous</button>
      <button class="btn nav" type="button" onclick="move(1)">Next ›</button>
    </div>
    <div class="utility-row">
      <button class="btn secondary" type="button" onclick="resetPosition()">↺ Restart</button>
      <button class="btn ghost" type="button" onclick="openJump()">⌕ Find word</button>
      <button class="btn ghost" type="button" onclick="goHome()">Levels</button>
    </div>
    <div class="rapid-display" id="rapidDisplay">${esc(words.join(' '))}</div>
    <div class="rapid-meta"><span id="rapidPosition">Word ${i+1} of ${arr.length}</span><span id="rapidRate">${w} WPM · ${c} word${c===1?'':'s'} at once</span></div>
    <div class="control-grid">
      <div class="control-block"><div class="label">Reading speed</div>
        <div class="wpm-row"><button class="control-btn" type="button" onclick="adjustWpm(-25)">−</button><div class="wpm-value" id="wpmValue">${w} WPM</div><button class="control-btn" type="button" onclick="adjustWpm(25)">+</button></div>
        <input class="range" type="range" min="100" max="1000" step="10" value="${w}" oninput="setWpm(this.value)" aria-label="Words per minute">
        <div class="presets">${[200,250,300,400,500].map(x=>`<button type="button" class="${w===x?'active':''}" onclick="setWpm(${x})">${x}</button>`).join('')}</div>
      </div>
      <div class="control-block"><div class="label">Words at once</div>
        <div class="chunks">${[1,2,3,4,5].map(x=>`<button type="button" class="${c===x?'active':''}" onclick="setChunk(${x})">${x}</button>`).join('')}</div>
      </div>
    </div>
  </div>`;
}

let rapidRunning=false,rapidTimer=null,ticks=0;
function intervalMs(){return Math.max(60,60000*state.chunk/state.wpm)}
function refreshRapid(){
  if(!$('reader').classList.contains('active'))return;
  const arr=levelWords(),i=currentPos();
  const d=$('rapidDisplay'),p=$('rapidPosition'),r=$('rapidRate'),v=$('wpmValue');
  if(d)d.textContent=currentWords().join(' ');if(p)p.textContent=(i+1)+' / '+arr.length;if(r)r.textContent=state.wpm+' WPM · '+state.chunk+' word'+(state.chunk===1?'':'s')+' at once';if(v)v.textContent=state.wpm+' WPM';
  $('readerSubtitle').textContent=`Level ${state.level} · ${i+1} of ${arr.length}`;$('progressFill').style.width=((i+1)/arr.length*100)+'%';
}
function schedule(){clearTimeout(rapidTimer);if(!rapidRunning)return;rapidTimer=setTimeout(tick,intervalMs())}
function tick(){
  if(!rapidRunning)return;
  const n=levelWords().length;let next=currentPos()+state.chunk;
  if(next>=n){state.furthest[state.level]=1000;next=next%n}else state.furthest[state.level]=Math.max(state.furthest[state.level]||0,next+1);
  state.pos[state.level]=next;ticks++;if(ticks%10===0)save();refreshRapid();schedule();
}
function updatePlaybackButtons(){
  const play=$('playBtn'),pause=$('pauseBtn'),stop=$('stopBtn');
  if(play)play.disabled=rapidRunning;
  if(pause)pause.disabled=!rapidRunning;
  if(stop)stop.disabled=!rapidRunning;
}
function rapidToggle(){rapidRunning?rapidPause():rapidPlay()}
function rapidPlay(){if(rapidRunning)return;rapidRunning=true;updatePlaybackButtons();schedule()}
function rapidPause(){rapidRunning=false;clearTimeout(rapidTimer);rapidTimer=null;save();updatePlaybackButtons()}
function rapidStop(){rapidPause()}
function setWpm(v){const was=rapidRunning;rapidPause();state.wpm=Math.max(100,Math.min(1000,Number(v)||250));save();renderReader();if(was)rapidPlay()}
function adjustWpm(d){setWpm(state.wpm+d)}
function setChunk(v){const was=rapidRunning;rapidPause();state.chunk=Math.max(1,Math.min(5,Number(v)||1));save();renderReader();if(was)rapidPlay()}
function resetPosition(){rapidPause();state.pos[state.level]=0;save();renderReader();window.scrollTo({top:0,behavior:'smooth'})}

function openJump(){
  rapidPause();const opts=Array.from({length:10},(_,i)=>`<option value="${i+1}" ${state.level===i+1?'selected':''}>Level ${i+1}</option>`).join('');$('jumpLevel').innerHTML=opts;$('jumpNumber').value=currentPos()+1;$('searchWord').value='';const m=$('jumpModal');m.classList.add('show');m.setAttribute('aria-hidden','false')
}
function closeJump(){const m=$('jumpModal');m.classList.remove('show');m.setAttribute('aria-hidden','true')}
function jumpLevelChanged(v){const l=Number(v);if(l<1||l>10)return;state.level=l;save();renderReader();$('jumpNumber').value=currentPos()+1;$('searchWord').value=''}
function jumpByNumber(){let n=Math.round(Number($('jumpNumber').value));if(!Number.isFinite(n)||n<1||n>1000)return toast('Enter a word number from 1 to 1000.');setPos(n-1);renderReader();closeJump();window.scrollTo({top:0,behavior:'smooth'})}
function findWord(){const q=($('searchWord').value||'').trim().toLowerCase();if(!q)return toast('Type a word to search.');const arr=levelWords();let at=arr.indexOf(q);if(at<0)at=arr.findIndex(w=>w.includes(q));if(at<0)return toast('No match found in this level.');setPos(at);renderReader();closeJump();toast('Found: '+arr[at]);window.scrollTo({top:0,behavior:'smooth'})}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeJump();if(!$('reader').classList.contains('active'))return;if(['INPUT','SELECT'].includes(document.activeElement?.tagName))return;if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1);if(e.code==='Space'){e.preventDefault();rapidToggle()}});
window.addEventListener('pagehide',()=>rapidPause());

// Defensive integrity check: this should always pass in the release build.
(function verifyBank(){
  const flat=WORD_LEVELS.flat();const ok=WORD_LEVELS.length===10&&WORD_LEVELS.every(x=>x.length===1000)&&flat.length===10000&&new Set(flat).size===10000&&flat.every(w=>/^[a-z]{7,}$/.test(w));
  if(!ok)console.error('Word-bank integrity check failed.');
})();
