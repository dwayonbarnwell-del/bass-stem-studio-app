<title>Bass Stem Studio RC128 Top Packed Notes Release Candidate</title>
<script>
/* RC119: initialise the correct physical-device font before the first paint.
   This deliberately does not rely on viewport width alone, because Chrome's
   "Desktop site" option can report a desktop-like layout width on a phone. */
(() => {
  const root = document.documentElement;
  const safeNumber = value => Number.isFinite(Number(value)) ? Number(value) : 0;
  const screenW = safeNumber(window.screen && window.screen.width) || safeNumber(window.innerWidth);
  const screenH = safeNumber(window.screen && window.screen.height) || safeNumber(window.innerHeight);
  const shortSide = Math.min(screenW || 9999, screenH || 9999);
  const touchPoints = safeNumber(navigator.maxTouchPoints);
  const ua = String(navigator.userAgent || '');
  const uaMobile = /Android|iPhone|iPad|iPod|Mobile|IEMobile|Opera Mini/i.test(ua);
  const uaDataMobile = !!(navigator.userAgentData && navigator.userAgentData.mobile === true);
  const coarsePointer = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  const phoneSizedScreen = shortSide <= 600;
  const touchHandheld = touchPoints > 1 && ((coarsePointer && shortSide <= 1200) || shortSide <= 900);
  const isMobile = uaDataMobile || uaMobile || phoneSizedScreen || touchHandheld;
  const mode = isMobile ? 'mobile' : 'desktop';
  const autoSize = isMobile ? 10 : 12;
  let selected = autoSize;
  try {
    const saved = Number(localStorage.getItem(`bassStemStudioFontPxV2:${mode}`));
    if (Number.isFinite(saved) && saved >= 1 && saved <= 100) selected = Math.round(saved);
  } catch (_) {}
  root.dataset.device = mode;
  root.dataset.fontPx = String(selected);
  root.style.setProperty('--ui-font-size', `${selected}px`);
  window.__bassStudioDisplay = { mode, autoSize, selected };
})();
</script>

  function updateAudioParams(){

    // added only from the genuine backend-separated bass stem. RC97 deliberately
    // does not rebuild bass by subtracting two compressed browser audio streams,
    // because that produces phase/codec noise.
    const useNoBass=!!noBassReady;

    if(mainSourceGain) mainSourceGain.gain.setTargetAtTime(useNoBass?0:1,now,.01);
    if(noBassSourceGain) noBassSourceGain.gain.setTargetAtTime(useNoBass?1:0,now,.01);
    if(bassStemSourceGain) bassStemSourceGain.gain.setTargetAtTime(trueBassAvailable?1:0,now,.01);

    if(bassCancelGain) bassCancelGain.gain.setTargetAtTime(0,now,.01);

  async function resampleStereo44100(src){
    if(src.sampleRate===AI_SR && src.numberOfChannels>=2) return src;
    const len=Math.ceil(src.duration*AI_SR);

  function fftInPlace(re,im){
    const n=re.length;
    for(let i=1,j=0;i<n;i++){
      let bit=n>>1;
      for(;j&bit;bit>>=1)j^=bit;
      j^=bit;
      if(i<j){let q=re[i];re[i]=re[j];re[j]=q;q=im[i];im[i]=im[j];im[j]=q}
    }
    for(let len=2;len<=n;len<<=1){
      const ang=-2*Math.PI/len,wr0=Math.cos(ang),wi0=Math.sin(ang);
      for(let i=0;i<n;i+=len){
        let wr=1,wi=0;
        for(let j=0;j<len/2;j++){
          const u=i+j,v=u+len/2,vr=re[v]*wr-im[v]*wi,vi=re[v]*wi+im[v]*wr;
          re[v]=re[u]-vr;im[v]=im[u]-vi;re[u]+=vr;im[u]+=vi;
          const nw=wr*wr0-wi*wi0;wi=wr*wi0+wi*wr0;wr=nw;
        }
      }
    }
  }

  function reflectIndex(i,n){
    if(n<=1)return 0;
    while(i<0||i>=n){
      if(i<0)i=-i;
      if(i>=n)i=2*n-2-i;
    }
    return i;
  }

  function makeSCNetInput(left,right,startSample){
    const out=new Float32Array(4*AI_BINS*AI_FRAMES);
    const re=new Float32Array(AI_NFFT),im=new Float32Array(AI_NFFT);
    const scale=1/Math.sqrt(AI_NFFT);
    for(let c=0;c<2;c++){
      const sig=c===0?left:right;
      for(let t=0;t<AI_FRAMES;t++){
        const center=t*AI_HOP;
        for(let j=0;j<AI_NFFT;j++){
          const local=center+j-(AI_NFFT>>1);
          let v=0;
          if(local<AI_PADDED){
            let srcLocal=local;
            if(srcLocal<0) srcLocal=reflectIndex(srcLocal,AI_PADDED);
            else if(srcLocal>=AI_PADDED) srcLocal=reflectIndex(srcLocal,AI_PADDED);
            if(srcLocal<AI_CHUNK){
              const gi=startSample+srcLocal;
              if(gi>=0&&gi<sig.length)v=sig[gi];
            }
          }
          re[j]=v;im[j]=0;
        }
        fftInPlace(re,im);
        const rc=c*2,ic=rc+1;
        for(let k=0;k<AI_BINS;k++){
          out[(rc*AI_BINS+k)*AI_FRAMES+t]=re[k]*scale;
          out[(ic*AI_BINS+k)*AI_FRAMES+t]=im[k]*scale;
        }
      }
    }
    return out;
  }

  function outputBassMag(data,t,k){
    // Output shape [8,2049,120,2], stem order drums,bass,other,vocals,
    // two stereo channels per stem. Bass = axes 2 and 3.
    let sum=0;
    for(let oc=2;oc<=3;oc++){
      const idx=(((oc*AI_BINS+k)*AI_FRAMES+t)*2);
      const rr=data[idx],ii=data[idx+1];
      sum+=Math.hypot(rr,ii);
    }
    return sum*.5;
  }

  function bassPitchFromSCNet(data,t,prevMidi){
    let best=null,second=null;
    function pAt(freq){
      const exact=freq*AI_NFFT/AI_SR;
      const b=Math.max(1,Math.min(AI_BINS-2,Math.round(exact)));
      return (outputBassMag(data,t,b-1)+outputBassMag(data,t,b)+outputBassMag(data,t,b+1))/3;
    }
    // Physical bass range E1-E3; display mapping is applied only afterwards.
    for(let m=28;m<=52;m++){
      const f=440*Math.pow(2,(m-69)/12);
      const p1=pAt(f),p2=pAt(f*2),p3=pAt(f*3),p4=pAt(f*4);
      let score=4.2*p1+1.0*p2+.48*p3+.22*p4;
      if(m>=40){
        const sub=pAt(f/2);
        if(sub>p1*.38)score*=.55;
      }
      if(prevMidi!==null){
        const d=Math.abs(m-prevMidi);
        if(d===0)score*=1.15;
        else if(d<=2)score*=1.05;
        else if(d>=7)score*=.72;
      }
      const cand={midi:m,score,p1,p2};
      if(!best||score>best.score){second=best;best=cand}
      else if(!second||score>second.score)second=cand;
    }
    if(!best)return null;
    const dom=best.score/((second?.score||0)+1e-12);
    if(best.p1<1e-5||dom<1.006)return null;
    return best.midi;
  }


  function ifftInPlace(re,im){
    for(let i=0;i<im.length;i++)im[i]=-im[i];
    fftInPlace(re,im);
    const inv=1/re.length;
    for(let i=0;i<re.length;i++){re[i]*=inv;im[i]=-im[i]*inv}
  }

  function bassMaskToMono(inputSpec,modelOut){
    // Reconstruct the isolated bass stem from SCNet before pitch estimation.
    const outLen=AI_PADDED+AI_NFFT;
    const audio=new Float32Array(outLen),weight=new Float32Array(outLen);
    const re=new Float32Array(AI_NFFT),im=new Float32Array(AI_NFFT);
    const win=new Float32Array(AI_NFFT);
    for(let i=0;i<AI_NFFT;i++)win[i]=Math.sqrt(.5-.5*Math.cos(2*Math.PI*i/(AI_NFFT-1)));

    for(let t=0;t<AI_FRAMES;t++){
      for(let k=0;k<AI_BINS;k++){
        const lr=inputSpec[((0*AI_BINS+k)*AI_FRAMES+t)];
        const li=inputSpec[((1*AI_BINS+k)*AI_FRAMES+t)];
        const rr=inputSpec[((2*AI_BINS+k)*AI_FRAMES+t)];
        const ri=inputSpec[((3*AI_BINS+k)*AI_FRAMES+t)];
        const mr=(lr+rr)*.5,mi=(li+ri)*.5;
        const mixMag=Math.hypot(mr,mi)+1e-9;

        let bassMag=0,totalMag=0;
        for(let stem=0;stem<4;stem++){
          let sm=0;
          for(let c=0;c<2;c++){
            const oc=stem*2+c,idx=(((oc*AI_BINS+k)*AI_FRAMES+t)*2);
            sm+=Math.hypot(modelOut[idx],modelOut[idx+1]);
          }
          sm*=.5;totalMag+=sm;
          if(stem===1)bassMag=sm;
        }
        const mask=Math.max(0,Math.min(1.25,bassMag/(totalMag+1e-9)));
        const target=bassMag*mask;
        re[k]=(mr/mixMag)*target;
        im[k]=(mi/mixMag)*target;
      }

      for(let k=AI_BINS;k<AI_NFFT;k++){
        const src=AI_NFFT-k;
        re[k]=re[src];im[k]=-im[src];
      }
      ifftInPlace(re,im);

      const center=t*AI_HOP,start=center-(AI_NFFT>>1);
      for(let j=0;j<AI_NFFT;j++){
        const p=start+j;
        if(p>=0&&p<outLen){
          const w=win[j];
          audio[p]+=re[j]*w;
          weight[p]+=w*w;
        }
      }
    }
    for(let i=0;i<audio.length;i++)if(weight[i]>.001)audio[i]/=weight[i];
    return audio.slice(0,AI_CHUNK);
  }

  function resampleArrayLinear(x,fromSR,toSR){
    if(fromSR===toSR)return x;
    const n=Math.max(1,Math.floor(x.length*toSR/fromSR));
    const y=new Float32Array(n),ratio=fromSR/toSR;
    for(let i=0;i<n;i++){
      const p=i*ratio,j=Math.floor(p),f=p-j;
      const a=x[Math.min(j,x.length-1)],b=x[Math.min(j+1,x.length-1)];
      y[i]=a+(b-a)*f;
    }
    return y;
  }

  function normaliseCrepeFrame(src,start){
    const x=new Float32Array(CREPE_WIN);
    let mean=0;
    for(let i=0;i<CREPE_WIN;i++){const v=src[start+i]||0;x[i]=v;mean+=v}
    mean/=CREPE_WIN;
    let ss=0;
    for(let i=0;i<CREPE_WIN;i++){x[i]-=mean;ss+=x[i]*x[i]}
    const sd=Math.sqrt(ss/Math.max(1,CREPE_WIN-1))+1e-8;
    for(let i=0;i<CREPE_WIN;i++)x[i]/=sd;
    return x;
  }

  function decodeCrepeRow(a,offset){
    let peak=0,conf=-Infinity;
    for(let b=0;b<CREPE_BINS;b++){
      const v=a[offset+b];
      if(v>conf){conf=v;peak=b}
    }
    let sw=0,sc=0;
    for(let b=Math.max(0,peak-4);b<=Math.min(CREPE_BINS-1,peak+4);b++){
      const w=Math.max(0,a[offset+b]);
      sw+=w;sc+=w*(20*b+1997.3794084376191);
    }
    if(sw<=0)return {hz:0,conf:0};
    const cents=sc/sw;
    return {hz:10*Math.pow(2,cents/1200),conf};
  }

  async function crepePitchFrames(bassMono,chunkStartSec){
    const x=resampleArrayLinear(bassMono,AI_SR,CREPE_SR);
    const starts=[];
    for(let s=0;s+CREPE_WIN<=x.length;s+=CREPE_HOP)starts.push(s);
    const frames=[],batch=(activeQuality==='mobile'?32:64); // RC17: larger laptop batches

    for(let b0=0;b0<starts.length;b0+=batch){
      const n=Math.min(batch,starts.length-b0);
      const data=new Float32Array(n*CREPE_WIN);
      for(let r=0;r<n;r++)data.set(normaliseCrepeFrame(x,starts[b0+r]),r*CREPE_WIN);

      const tensor=new ort.Tensor('float32',data,[n,CREPE_WIN]);
      const feeds={};feeds[crepeSession.inputNames[0]]=tensor;
      const result=await crepeSession.run(feeds);
      const ot=result[crepeSession.outputNames[0]],y=ot.data;

      for(let r=0;r<n;r++){
        const d=decodeCrepeRow(y,r*CREPE_BINS);
        const mf=d.hz>0?69+12*Math.log2(d.hz/440):null;
        const midi=mf===null?null:Math.round(mf);
        // Physical electric-bass range only; no song/key is hard coded.
        const minConf=.38; // RC24 mobile fills: retain weaker but coherent bass articulations
        const valid=midi!==null&&midi>=28&&midi<=52&&d.conf>=minConf;
        frames.push({t:chunkStartSec+starts[b0+r]/CREPE_SR,midi:valid?midi:null,conf:d.conf,hz:d.hz});
      }
      if(ot&&typeof ot.dispose==='function')ot.dispose();
      await new Promise(r=>setTimeout(r,0));
    }
    return frames;
  }

  function decodeNeuralBassNotes(aiFrames,from,to){
    aiFrames.sort((a,b)=>a.t-b.t);
    const minStableSec=Math.max(.075,Math.min(.10,Number(stableMs?.value||120)/1000)); // allow short bass fills
    const confirm=Math.max(4,Math.round(minStableSec/(CREPE_HOP/CREPE_SR)));
    const release=Math.max(5,Math.round(.10/(CREPE_HOP/CREPE_SR)));
    const voted=new Array(aiFrames.length).fill(null);

    for(let i=0;i<aiFrames.length;i++){
      const counts=new Map();
      for(let j=Math.max(0,i-4);j<=Math.min(aiFrames.length-1,i+4);j++){
        const m=aiFrames[j].midi;
        if(m!==null)counts.set(m,(counts.get(m)||0)+1);
      }
      let bm=null,bc=0;
      for(const [m,c] of counts)if(c>bc){bm=m;bc=c}
      if(bc>=5)voted[i]=bm;
    }

    const path=new Array(voted.length).fill(null);
    let cur=null,pending=null,pc=0,miss=0;
    for(let i=0;i<voted.length;i++){
      const cand=voted[i];
      if(cur===null){
        if(cand===null){pending=null;pc=0;continue}
        if(cand===pending)pc++;else{pending=cand;pc=1}
        if(pc>=confirm){
          cur=pending;
          for(let k=Math.max(0,i-confirm+1);k<=i;k++)path[k]=cur;
          pending=null;pc=0;miss=0;
        }
        continue;
      }

      if(cand===cur){path[i]=cur;pending=null;pc=0;miss=0;continue}
      if(cand===null){
        miss++;
        if(miss<=release)path[i]=cur;else cur=null;
        pending=null;pc=0;continue;
      }

      miss=0;
      const need=Math.abs(cand-cur)>=7?confirm+3:confirm;
      if(cand===pending)pc++;else{pending=cand;pc=1}
      if(pc>=need){
        cur=cand;
        for(let k=Math.max(0,i-need+1);k<=i;k++)path[k]=cur;
        pending=null;pc=0;
      }else path[i]=cur;
    }

    const raw=[];let state=null,st=from;
    for(let i=0;i<=path.length;i++){
      const m=i<path.length?path[i]:null,t=i<aiFrames.length?aiFrames[i].t:to;
      if(m!==state){
        if(state!==null&&t-st>=minStableSec)raw.push({midi:state,start:st,end:t,source:'SCNet + CREPE AI'});
        state=m;st=t;
      }
    }

    const merged=[];
    for(const n of raw){
      const p=merged[merged.length-1];
      if(p&&p.midi===n.midi&&n.start-p.end<=.16)p.end=n.end;
      else merged.push({...n});
    }
    return merged;
  }


  function reflectSample(sig,i){
    const n=sig.length;
    if(n<=1)return sig[0]||0;
    while(i<0||i>=n){
      if(i<0)i=-i;
      if(i>=n)i=2*n-2-i;
    }
    return sig[i]||0;
  }

  function makeProSTFT(left,right,startSample){
    const real=new Float32Array(2*PRO_BINS*PRO_FRAMES);
    const imag=new Float32Array(2*PRO_BINS*PRO_FRAMES);
    const re=new Float32Array(PRO_NFFT),im=new Float32Array(PRO_NFFT);
    const hann=new Float32Array(PRO_NFFT);
    for(let i=0;i<PRO_NFFT;i++)hann[i]=.5-.5*Math.cos(2*Math.PI*i/(PRO_NFFT-1));

    for(let c=0;c<2;c++){
      const sig=c===0?left:right;
      for(let t=0;t<PRO_FRAMES;t++){
        const center=t*PRO_HOP;
        for(let j=0;j<PRO_NFFT;j++){
          const local=center+j-(PRO_NFFT>>1);
          const gi=startSample+local;
          // PyTorch center=True reflection at chunk edges.
          let v=0;
          if(local>=0&&local<PRO_SAMPLES){
            v=(gi>=0&&gi<sig.length)?sig[gi]:0;
          }else{
            const r=reflectIndex(local,PRO_SAMPLES);
            const rg=startSample+r;
            v=(rg>=0&&rg<sig.length)?sig[rg]:0;
          }
          re[j]=v*hann[j];im[j]=0;
        }
        fftInPlace(re,im);
        const base=c*PRO_BINS*PRO_FRAMES;
        for(let k=0;k<PRO_BINS;k++){
          real[base+k*PRO_FRAMES+t]=re[k];
          imag[base+k*PRO_FRAMES+t]=im[k];
        }
      }
    }
    return {real,imag};
  }

  function proBassToMono(outR,outI){
    // BS-RoFormer output: [1,6,2,1025,345], stem 0 = bass.
    const padded=PRO_SAMPLES+PRO_NFFT;
    const audio=new Float32Array(padded),weight=new Float32Array(padded);
    const re=new Float32Array(PRO_NFFT),im=new Float32Array(PRO_NFFT);
    const hann=new Float32Array(PRO_NFFT);
    for(let i=0;i<PRO_NFFT;i++)hann[i]=.5-.5*Math.cos(2*Math.PI*i/(PRO_NFFT-1));

    for(let t=0;t<PRO_FRAMES;t++){
      for(let k=0;k<PRO_BINS;k++){
        let rr=0,ii=0;
        for(let c=0;c<2;c++){
          const idx=(((0*2+c)*PRO_BINS+k)*PRO_FRAMES+t);
          rr+=outR[idx];ii+=outI[idx];
        }
        re[k]=rr*.5;im[k]=ii*.5;
      }
      for(let k=PRO_BINS;k<PRO_NFFT;k++){
        const src=PRO_NFFT-k;
        re[k]=re[src];im[k]=-im[src];
      }
      ifftInPlace(re,im);
      const center=t*PRO_HOP,start=center-(PRO_NFFT>>1);
      for(let j=0;j<PRO_NFFT;j++){
        const p=start+j;
        if(p>=0&&p<padded){
          const w=hann[j];
          audio[p]+=re[j]*w;
          weight[p]+=w*w;
        }
      }
    }
    for(let i=0;i<audio.length;i++)if(weight[i]>.00001)audio[i]/=weight[i];
    return audio.slice(0,PRO_SAMPLES);
  }

  async function analyseBassPro(src,from,to){
    const session=await ensureProSession();
    const left=src.getChannelData(0),right=src.numberOfChannels>1?src.getChannelData(1):left;
    const first=Math.floor(from*AI_SR),last=Math.ceil(to*AI_SR);
    const starts=[];
    for(let s=first;s<last;s+=PRO_STEP)starts.push(s);
    const aiFrames=[];

    for(let ci=0;ci<starts.length;ci++){
      const s=starts[ci];
      aiStatus(`PRO separation + neural pitch… ${ci+1}/${starts.length}`,10+82*ci/Math.max(1,starts.length));
      const sp=makeProSTFT(left,right,s);
      const feeds={};
      feeds[session.inputNames[0]]=new ort.Tensor('float32',sp.real,[1,2,PRO_BINS,PRO_FRAMES]);
      feeds[session.inputNames[1]]=new ort.Tensor('float32',sp.imag,[1,2,PRO_BINS,PRO_FRAMES]);
      const result=await session.run(feeds);

      const rTensor=result[session.outputNames[0]];
      const iTensor=result[session.outputNames[1]];
      const bassMono=proBassToMono(rTensor.data,iTensor.data);
      const chunkStart=s/AI_SR;
      const pf=await crepePitchFrames(bassMono,chunkStart);

      // RC15: 12.5% overlap. Keep the central 3.5 s; enough boundary context
      // for continuity while requiring fewer expensive BS-RoFormer passes.
      const acceptL=ci===0?from:chunkStart+.25;
      const acceptR=ci===starts.length-1?to:chunkStart+3.75;
      for(const f of pf)if(f.t>=acceptL&&f.t<=acceptR&&f.t>=from&&f.t<=to)aiFrames.push(f);

      if(rTensor&&typeof rTensor.dispose==='function')rTensor.dispose();
      if(iTensor&&typeof iTensor.dispose==='function')iTensor.dispose();
      await new Promise(r=>setTimeout(r,0));
    }
    return decodeNeuralBassNotes(aiFrames,from,to);
  }


  async function analyseBassBalanced(src,from,to){
    // RC17: one SCNet pass per 2.75 s block. RC16 used 50% overlap, which
    // nearly doubled inference time and could make a full song hundreds of passes.
    await ensureAiSession();
    const left=src.getChannelData(0),right=src.numberOfChannels>1?src.getChannelData(1):left;
    const first=Math.floor(from*AI_SR),last=Math.ceil(to*AI_SR);
    const starts=[];
    for(let s=first;s<last;s+=AI_CHUNK)starts.push(s);
    const frames=[];

    for(let ci=0;ci<starts.length;ci++){
      const s=starts[ci];
      aiStatus(`BALANCED fast separation + neural pitch… ${ci+1}/${starts.length}`,
               10+80*ci/Math.max(1,starts.length));
      const spec=makeSCNetInput(left,right,s);
      const feeds={};
      feeds[aiSession.inputNames[0]]=new ort.Tensor('float32',spec,[1,4,AI_BINS,AI_FRAMES]);
      const result=await aiSession.run(feeds);
      const ot=result[aiSession.outputNames[0]];
      const bassMono=bassMaskToMono(spec,ot.data);
      const pf=await crepePitchFrames(bassMono,s/AI_SR);
      for(const f of pf) if(f.t>=from && f.t<=to) frames.push(f);

      if(ot&&typeof ot.dispose==='function')ot.dispose();
      // Yield only every few blocks; avoids unnecessary UI scheduling overhead.
      if((ci&3)===3) await new Promise(r=>setTimeout(r,0));
    }
    return decodeNeuralBassNotes(frames,from,to);
  }

  function openRecoveryDb(){

      const request=indexedDB.open(RUNPOD_RECOVERY_DB,1);

  async function cacheAudioForRecovery(file){
    if(!file)return false;
    const signature=cloudFileSignature(file);
    try{
      const db=await openRecoveryDb();
      await new Promise((resolve,reject)=>{
        const tx=db.transaction(RUNPOD_RECOVERY_STORE,'readwrite');
        const store=tx.objectStore(RUNPOD_RECOVERY_STORE);
        store.clear();
        store.put({
          signature,
          name:file.name||'audio.mp3',
          type:file.type||'audio/mpeg',
          lastModified:Number(file.lastModified)||Date.now(),
          size:Number(file.size)||0,
          blob:file,
          cachedAt:Date.now()
        });
        tx.oncomplete=()=>resolve(true);
        tx.onerror=()=>reject(tx.error||new Error('Could not save recovery audio.'));
        tx.onabort=()=>reject(tx.error||new Error('Could not save recovery audio.'));
      });
      db.close();
      return true;
    }catch(err){
      console.warn('Analysis recovery audio could not be cached',err);
      return false;
    }
  }

  function loadExternalScript(src){

  async function ensureLargeSongEncoder(){
    if(window.lamejs?.Mp3Encoder)return window.lamejs;
    if(lameEncoderLoadPromise)return lameEncoderLoadPromise;
    lameEncoderLoadPromise=(async()=>{
      // lamejs is kept as a separate LGPL library, as recommended by its licence.
      // Project: https://github.com/zhuker/lamejs
      // Fixed package version only. Avoid a mutable repository branch on the
      // same page that stores the user's analysis-service key.
      const sources=[
        'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js'
      ];
      let lastErr=null;
      for(const src of sources){
        try{
          await loadExternalScript(src);
          if(window.lamejs?.Mp3Encoder)return window.lamejs;
        }catch(err){lastErr=err;}
      }
      throw lastErr||new Error('Could not prepare the large-song encoder.');
    })();
    try{return await lameEncoderLoadPromise}
    catch(err){lameEncoderLoadPromise=null;throw err}
  }

  function chooseAnalysisMp3Bitrate(durationSeconds,targetBytes=RUNPOD_RUNSYNC_RAW_SAFE_BYTES){
    const duration=Math.max(1,Number(durationSeconds)||0);
    // Leave a little room for MP3 frame/header overhead.
    const maxKbps=Math.floor((targetBytes*.99*8)/(duration*1000));
    const rates=[192,160,144,128,112,96,80,64];
    return rates.find(k=>k<=maxKbps)||null;
  }

  function pcmFloatToInt16(value){
    const v=Math.max(-1,Math.min(1,Number(value)||0));
    return v<0 ? Math.round(v*32768) : Math.round(v*32767);
  }

  async function encodeAudioBufferForAnalysis(audioBuffer,kbps,startSeconds=0,endSeconds=null,progressLabel=''){
    const lame=await ensureLargeSongEncoder();
    const channels=Math.min(2,Math.max(1,audioBuffer.numberOfChannels||1));
    const sampleRate=Math.round(audioBuffer.sampleRate||44100);
    const supportedRates=new Set([48000,44100,32000,24000,22050,16000,12000,11025,8000]);
    if(!supportedRates.has(sampleRate))
      throw new Error(`This device decoded the song at ${sampleRate} Hz, which the large-song encoder cannot safely use.`);

    const startSample=clamp(Math.floor(Math.max(0,Number(startSeconds)||0)*sampleRate),0,audioBuffer.length);
    const endSec=endSeconds===null||endSeconds===undefined?audioBuffer.duration:Number(endSeconds);
    const endSample=clamp(Math.ceil(Math.max(Number(startSeconds)||0,endSec)*sampleRate),startSample,audioBuffer.length);
    const total=Math.max(0,endSample-startSample);
    if(total<sampleRate*.25)throw new Error('This song part is too short to analyse.');

    const encoder=new lame.Mp3Encoder(channels,sampleRate,kbps);
    const blockSize=1152;
    const leftSource=audioBuffer.getChannelData(0);
    const rightSource=channels===2 ? audioBuffer.getChannelData(1) : null;
    const left=new Int16Array(blockSize);
    const right=channels===2 ? new Int16Array(blockSize) : null;
    const chunks=[];
    let lastYield=performance.now();

    for(let offset=0;offset<total;offset+=blockSize){
      const len=Math.min(blockSize,total-offset);
      const sourceStart=startSample+offset;
      for(let i=0;i<len;i++){
        left[i]=pcmFloatToInt16(leftSource[sourceStart+i]);
        if(right)right[i]=pcmFloatToInt16(rightSource[sourceStart+i]);
      }
      const mp3buf=channels===2
        ? encoder.encodeBuffer(left.subarray(0,len),right.subarray(0,len))
        : encoder.encodeBuffer(left.subarray(0,len));
      if(mp3buf?.length)chunks.push(mp3buf);

      const now=performance.now();
      if(now-lastYield>80){
        if(progressLabel)aiStatus(progressLabel,Math.min(8,3+Math.round((offset/Math.max(1,total))*5)));
        await new Promise(r=>setTimeout(r,0));
        lastYield=performance.now();
      }
    }

    const tail=encoder.flush();
    if(tail?.length)chunks.push(tail);
    return new Blob(chunks,{type:'audio/mpeg'});
  }

  async function prepareAudioForRunPod(originalFile){
    const signature=cloudFileSignature(originalFile);
    if(preparedAnalysisUploadCache?.signature===signature)
      return preparedAnalysisUploadCache;

    // Small files keep the original upload and current asynchronous route.
    if(originalFile.size<=RUNPOD_RUN_RAW_SAFE_BYTES){
      return preparedAnalysisUploadCache={
        signature,file:originalFile,endpointAction:'run',prepared:false,bitrate:null
      };
    }

    // Files that already fit the larger RunPod request are uploaded unchanged.
    if(originalFile.size<=RUNPOD_RUNSYNC_RAW_SAFE_BYTES){
      return preparedAnalysisUploadCache={
        signature,file:originalFile,endpointAction:'runsync',prepared:false,bitrate:null
      };
    }

    if(!buffer||!Number.isFinite(buffer.duration)||buffer.duration<=0)
      throw new Error('The song could not be prepared for analysis.');

    const bitrate=chooseAnalysisMp3Bitrate(buffer.duration);
    if(!bitrate || bitrate<RUNPOD_MIN_ANALYSIS_BITRATE_KBPS){
      throw new Error('This recording is too long to prepare at a quality suitable for accurate bass analysis. Please split it into shorter parts.');
    }

    aiStatus('In Progress.....',2);
    const preparedBlob=await encodeAudioBufferForAnalysis(buffer,bitrate);
    if(preparedBlob.size>RUNPOD_RUNSYNC_RAW_SAFE_BYTES){
      // One quality step lower is a safe fallback for encoder/container overhead.
      const rates=[192,160,144,128,112,96,80,64];
      const idx=rates.indexOf(bitrate);
      const lower=idx>=0 && idx<rates.length-1 ? rates[idx+1] : null;
      if(!lower || lower<RUNPOD_MIN_ANALYSIS_BITRATE_KBPS)
        throw new Error('The song is still too large after safe preparation. Please split it into shorter parts.');
      aiStatus('In Progress.....',3);
      const retryBlob=await encodeAudioBufferForAnalysis(buffer,lower);
      if(retryBlob.size>RUNPOD_RUNSYNC_RAW_SAFE_BYTES)
        throw new Error('The song is still too large after safe preparation. Please split it into shorter parts.');
      const safeName=(originalFile.name||'song').replace(/\.[^.]+$/,'')+'-analysis.mp3';
      const preparedFile=new File([retryBlob],safeName,{type:'audio/mpeg',lastModified:originalFile.lastModified||Date.now()});
      return preparedAnalysisUploadCache={
        signature,file:preparedFile,endpointAction:'runsync',prepared:true,bitrate:lower,
        originalSize:originalFile.size,preparedSize:preparedFile.size
      };
    }

    const safeName=(originalFile.name||'song').replace(/\.[^.]+$/,'')+'-analysis.mp3';
    const preparedFile=new File([preparedBlob],safeName,{type:'audio/mpeg',lastModified:originalFile.lastModified||Date.now()});
    return preparedAnalysisUploadCache={
      signature,file:preparedFile,endpointAction:'runsync',prepared:true,bitrate,
      originalSize:originalFile.size,preparedSize:preparedFile.size
    };
  }

  async function runPodFetch(url,key,options={},maxAttempts=8){
    let lastErr;
    for(let attempt=1;attempt<=maxAttempts;attempt++){
      try{
        const res=await fetch(url,{...options,headers:{
          'Accept':'application/json',
          'Authorization':'Bearer '+key,
          ...(options.body?{'Content-Type':'application/json'}:{}),
          ...(options.headers||{})
        }});
        const text=await res.text();
        let data;try{data=JSON.parse(text)}catch{data={raw:text}}
        if(!res.ok){
          const err=new Error(`RunPod HTTP ${res.status}: ${JSON.stringify(data).slice(0,900)}`);
          err.httpStatus=res.status;throw err;
        }
        return data;
      }catch(err){
        lastErr=err;
        if(err?.httpStatus===401) throw err;
        const msg=String(err?.message||err);
        const transient=/Failed to fetch|NetworkError|Load failed|network/i.test(msg);
        if(!transient||attempt===maxAttempts) throw err;
        aiStatus('In Progress.....',15);
        await cloudSleep(7000);
      }
    }
    throw lastErr;
  }

  async function pollRunPodJob(key,id){
    for(let checks=0;checks<360;checks++){
      const d=await runPodFetch(`https://api.runpod.ai/v2/${encodeURIComponent(RUNPOD_ENDPOINT)}/status/${encodeURIComponent(id)}`,key,{method:'GET'},12);
      const st=String(d.status||'UNKNOWN').toUpperCase();
      const pct=Math.min(94,18+checks*.7);
      aiStatus('Analysis sent — you can use other apps',pct);
      if(['COMPLETED','FAILED','CANCELLED','TIMED_OUT'].includes(st)) return d;
      await cloudSleep(5000);
    }
    throw new Error('Analysis took longer than 30 minutes. Tap Analyse Bass again to resume the saved job.');
  }

  function parseSongScaleContext(scaleText){
    const raw=String(scaleText||'').trim().replace(/♯/g,'#').replace(/♭/g,'b');
    const m=raw.match(/^([A-Ga-g])\s*([#b]?)(.*)$/);
    if(!m)return null;
    const base={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1].toUpperCase()];
    let rootPc=base;
    if(m[2]==='#')rootPc=(rootPc+1)%12;
    if(m[2]==='b')rootPc=(rootPc+11)%12;
    const modeText=String(m[3]||'').trim().toLowerCase();
    let mode='major';
    if(/^(m|min|minor)\b/.test(modeText) || /aeolian/.test(modeText))mode='minor';
    else if(/dorian/.test(modeText))mode='dorian';
    else if(/phrygian/.test(modeText))mode='phrygian';
    else if(/lydian/.test(modeText))mode='lydian';
    else if(/mixolydian/.test(modeText))mode='mixolydian';
    else if(/locrian/.test(modeText))mode='locrian';
    const intervals={
      major:[0,2,4,5,7,9,11],
      minor:[0,2,3,5,7,8,10],
      dorian:[0,2,3,5,7,9,10],
      phrygian:[0,1,3,5,7,8,10],
      lydian:[0,2,4,6,7,9,11],
      mixolydian:[0,2,4,5,7,9,10],
      locrian:[0,1,3,5,6,8,10]
    }[mode];
    return {rootPc,mode,intervals,scaleText:raw};
  }

  function preferredBassPosition(targetMidi,count=bassViewStringCount){
    const rows=BASS_STANDARD_TUNINGS[count]||BASS_STANDARD_TUNINGS[5];
    const midi=Math.round(Number(targetMidi));
    if(!Number.isFinite(midi))return null;

    const candidates=[];
    rows.forEach((s,stringIndex)=>{
      const fret=midi-s.openMidi;
      if(fret>=0 && fret<=12){
        // User preference: frets 1-12 first. Open strings are used only when
        // there is no practical fretted alternative inside the practice neck.
        const score=(fret===0?50:fret)+(stringIndex*.015);
        candidates.push({
          stringIndex,
          stringName:s.name,
          openNote:s.openNote,
          fret,
          score
        });
      }
    });
    if(!candidates.length)return null;
    candidates.sort((a,b)=>a.score-b.score || a.stringIndex-b.stringIndex);
    return candidates[0];
  }

  function numberingScaleContext(){
    if(!currentScaleContext)return null;
    // RC103: when the detected/selected key is natural minor, use the
    // RELATIVE MAJOR for Nashville-style numbering. Example:
    // A Min -> C Maj numbers, so A=6, B=7, C=1, D=2, E=3, F=4, G=5.
    if(currentScaleContext.mode==='minor'){
      const majorRootPc=(currentScaleContext.rootPc+3)%12;
      return {
        rootPc:majorRootPc,
        mode:'major',
        intervals:[0,2,4,5,7,9,11],
        scaleText:scaleTextFor(majorRootPc,'major'),
        relativeMinorText:currentScaleContext.scaleText
      };
    }
    return currentScaleContext;
  }

  function numberingScaleDescription(){
    const ctx=numberingScaleContext();
    if(!ctx)return '';
    if(currentScaleContext?.mode==='minor')
      return `${ctx.scaleText} numbers (relative major of ${currentScaleContext.scaleText})`;
    return `${ctx.scaleText} numbers`;
  }

  function scaleDegreeLabel(midi){
    const ctx=numberingScaleContext();
    if(!ctx || !Number.isFinite(Number(midi)))return null;
    const delta=((Math.round(Number(midi))%12)-ctx.rootPc+12)%12;
    const steps=ctx.intervals;
    const exact=steps.indexOf(delta);
    if(exact>=0)return String(exact+1);
    // For chromatic notes, label the semitone above the preceding scale degree.
    // In a major key this gives: #1, #2, #4, #5 and #6.
    let prev=0;
    for(let i=0;i<steps.length;i++){
      if(steps[i]<delta)prev=i;
      else break;
    }
    return '#'+String(prev+1);
  }

  function displayNoteLabel(midi,savedScaleNumber=null){
    const shifted=Math.round(Number(midi))+transposeSemitones;
    if(noteDisplayMode==='numbers'){
      // Always calculate from the CURRENT scale context. This deliberately
      // overrides an older saved minor-key number so imported projects also
      // follow the RC103 relative-major numbering rule.
      const degree=scaleDegreeLabel(shifted);
      if(degree)return degree;
      if(savedScaleNumber!==null && savedScaleNumber!==undefined && String(savedScaleNumber).trim())
        return String(savedScaleNumber).trim();
    }
    return midiName(shifted);
  }

  const SCALE_ROOTS=[{pc:0,n:'C'},{pc:1,n:'C#'},{pc:2,n:'D'},{pc:3,n:'Eb'},{pc:4,n:'E'},{pc:5,n:'F'},{pc:6,n:'F#'},{pc:7,n:'G'},{pc:8,n:'Ab'},{pc:9,n:'A'},{pc:10,n:'Bb'},{pc:11,n:'B'}];
  function modeLabel(mode){return ({major:'Maj',minor:'Min',dorian:'Dorian',phrygian:'Phrygian',lydian:'Lydian',mixolydian:'Mixolydian',locrian:'Locrian'})[mode]||'Maj';}
  function scaleTextFor(rootPc,mode){const r=SCALE_ROOTS.find(x=>x.pc===rootPc)||SCALE_ROOTS[0];return `${r.n} ${modeLabel(mode)}`;}
  function compactScaleTextFor(rootPc,mode){
    const r=SCALE_ROOTS.find(x=>x.pc===rootPc)||SCALE_ROOTS[0];
    const short=({major:'Maj',minor:'Min',dorian:'Dor',phrygian:'Phr',lydian:'Lyd',mixolydian:'Mix',locrian:'Loc'})[mode]||'Maj';
    return `${r.n} ${short}`;
  }
  function signedTranspose(fromPc,toPc){let d=(toPc-fromPc+12)%12;if(d>6)d-=12;return d;}
  function populateScaleSelect(ctxInfo){
    if(!scaleSelect)return;scaleSelect.innerHTML='';
    if(!ctxInfo){const o=document.createElement('option');o.value='';o.textContent='—';scaleSelect.appendChild(o);scaleSelect.disabled=true;return;}
    for(const r of SCALE_ROOTS){
      const o=document.createElement('option');
      o.value=String(r.pc);
      o.textContent=compactScaleTextFor(r.pc,ctxInfo.mode);
      o.title=scaleTextFor(r.pc,ctxInfo.mode);
      scaleSelect.appendChild(o);
    }
    scaleSelect.value=String(ctxInfo.rootPc);scaleSelect.disabled=false;
  }
  function applySelectedScaleRoot(rootPc){
    if(!detectedScaleContext)return;
    const pc=((Number(rootPc)%12)+12)%12;transposeSemitones=signedTranspose(detectedScaleContext.rootPc,pc);
    currentScaleContext={...detectedScaleContext,rootPc:pc,scaleText:scaleTextFor(pc,detectedScaleContext.mode)};
    if(songScale)songScale.textContent=currentScaleContext.scaleText;
    if(scaleSelect && scaleSelect.value!==String(pc))scaleSelect.value=String(pc);
    if(songScaleWrap)songScaleWrap.title=`Detected ${detectedScaleContext.scaleText} · rehearsal key ${currentScaleContext.scaleText}${transposeSemitones?` · ${transposeSemitones>0?'+':''}${transposeSemitones} semitone${Math.abs(transposeSemitones)===1?'':'s'}`:''}`;
    updateAudioParams();refreshNoteNumberToggle();rebuildSimpleTimeline._sig='';
    if(buffer){rebuildSimpleTimeline();updateSongInfo(currentTime());}

  function resetSongContext(){
    currentScaleContext=null;detectedScaleContext=null;transposeSemitones=0;metronomeEnabled=false;lastMetronomeBeat=-1;lastMetronomeTime=null;detectedTempoBpm=null;
    detectedBeatTimes=[];detectedBeatsPerBar=4;detectedDownbeatPhase=0;beatGridConfidence=null;
    populateScaleSelect(null);refreshNoteNumberToggle();refreshMetronomeToggle();

  function applySongContext(out){
    let scale=String(out?.song_scale||'').trim();
    if(!scale && out?.song_key){
      const mode=String(out?.song_mode||'').trim();
      scale=`${String(out.song_key).trim()}${mode?' '+mode:''}`.trim();
    }
    if(scale){
      scale=scale.replace(/\bmajor\b/gi,'Maj').replace(/\bminor\b/gi,'Min');
      detectedScaleContext=parseSongScaleContext(scale);
      currentScaleContext=detectedScaleContext?{...detectedScaleContext}:null;
      transposeSemitones=0;populateScaleSelect(detectedScaleContext);
      refreshNoteNumberToggle();
      rebuildSimpleTimeline._sig='';
      if(songScale) songScale.textContent=detectedScaleContext?.scaleText||scale;
      if(songScaleWrap){
        songScaleWrap.classList.add('context-ready');
        const c=Number(out?.key_confidence);
        songScaleWrap.title=Number.isFinite(c)?`Detected song scale · ${Math.round(c*100)}% confidence`:'Detected song scale';
      }
    }else{
      currentScaleContext=null;detectedScaleContext=null;transposeSemitones=0;populateScaleSelect(null);
      refreshNoteNumberToggle();
      rebuildSimpleTimeline._sig='';
      if(songScale) songScale.textContent='—';
      if(songScaleWrap) songScaleWrap.classList.remove('context-ready');
    }

    const bpm=Number(out?.tempo_bpm);
    if(Number.isFinite(bpm) && bpm>0){
      detectedTempoBpm=bpm;
      if(songTempo) songTempo.textContent=String(Math.round(bpm));
      if(songTempoWrap){
        songTempoWrap.classList.add('context-ready');
        const c=Number(out?.tempo_confidence);
        songTempoWrap.title=Number.isFinite(c)?`Detected song tempo · ${Math.round(c*100)}% confidence`:'Detected song tempo';
      }
    }else{
      detectedTempoBpm=null;
      if(songTempo) songTempo.textContent='—';
      if(songTempoWrap) songTempoWrap.classList.remove('context-ready');
    }

    detectedBeatTimes=Array.isArray(out?.beat_times)
      ? out.beat_times.map(Number).filter(v=>Number.isFinite(v)&&v>=0).sort((a,b)=>a-b)
      : [];
    detectedBeatsPerBar=Math.max(1,Math.round(Number(out?.beats_per_bar)||4));
    detectedDownbeatPhase=Math.max(0,Math.round(Number(out?.downbeat_phase)||0));
    beatGridConfidence=Number.isFinite(Number(out?.beat_grid_confidence))?Number(out.beat_grid_confidence):null;
    lastMetronomeBeat=-1;lastMetronomeTime=null;
    refreshMetronomeToggle();
  }

  async function applyRunPodResult(finalData){
    if(String(finalData?.status||'').toUpperCase()!=='COMPLETED')
      throw new Error(`Analysis finished with status ${finalData?.status||'unknown'}`);
    const out=finalData.output||{};
    if(!out.ok) throw new Error(out.error||out.warning||'The analysis service did not return a successful result.');
    applySongContext(out);
    const engineLabel=cloudVersionLabel(out.analysis_version);
    if(cloudEngineBadge) cloudEngineBadge.textContent='Analysis mode';
    const cloudNotes=Array.isArray(out.notes)?out.notes:[];
    const mapped=cloudNotes.map(n=>{
      const start=Number(n.start),end=Number(n.end);
      const rawMidi=Number(n.midi);
      const midi=mapFreshCloudMidi(rawMidi);
      if(!Number.isFinite(start)||!Number.isFinite(end)||end<=start||!Number.isFinite(midi)) return null;
      return {
        midi:Math.round(midi),
        start,
        end,
        confidence:Number(n.confidence)||0,
        isFill:typeof n.is_fill==='boolean'?n.is_fill:undefined,
        cloudMidi:rawMidi,
        source:engineLabel
      };
    }).filter(Boolean).sort((a,b)=>a.start-b.start);
    if(!mapped.length) throw new Error(out.warning||'Analysis completed but no reliable bass notes were returned.');
    if(out.bass_audio_base64){
      await loadBassStemFromBase64(String(out.bass_audio_base64),String(out.bass_audio_mime||'audio/mpeg'));
    }else{
      clearBassStemPlayback();
    }
    if(out.no_bass_audio_base64){
      currentRehearsalVersion=String(out.rehearsal_version||'');
      await loadNoBassFromBase64(String(out.no_bass_audio_base64),String(out.no_bass_audio_mime||'audio/mpeg'));
    }else{
      clearNoBassPlayback();
    }
    notes=mapped;
    analysedBassNotes=mapped.map(n=>({...n}));
    offlineAnalysisReady=true;
    updatePracticeLayoutState(true);
    waveCacheDirty=true;
    rebuildSimpleTimeline._sig='';
    if(timelineScroll)timelineScroll.scrollLeft=0;
    drawAll();
    return {
      count:mapped.length,
      version:out.analysis_version||engineLabel,
      bassStemReady:!!bassStemReady
    };
  }

  function buildAnalysisPartPlan(file){
    if(!buffer||!Number.isFinite(buffer.duration)||buffer.duration<=0)return [];
    const duration=Number(buffer.duration);
    const count=Math.max(1,Math.ceil(duration/ANALYSIS_PART_SECONDS));
    return Array.from({length:count},(_,i)=>{
      const coreStart=i*ANALYSIS_PART_SECONDS;
      const coreEnd=Math.min(duration,(i+1)*ANALYSIS_PART_SECONDS);
      const audioStart=Math.max(0,coreStart-(i>0?ANALYSIS_PART_OVERLAP:0));
      const audioEnd=Math.min(duration,coreEnd+(i<count-1?ANALYSIS_PART_OVERLAP:0));
      return {index:i,label:`P${i+1}`,coreStart,coreEnd,audioStart,audioEnd,id:null};
    });
  }

  async function prepareAnalysisPartUpload(file,part,totalParts){
    const wholeSong=totalParts===1 && part.audioStart<=.001 && Math.abs(part.audioEnd-buffer.duration)<.05;
    if(wholeSong && file.size<=RUNPOD_RUN_RAW_SAFE_BYTES){
      return {file,bitrate:null,prepared:false};
    }

    const rates=[ANALYSIS_PART_BITRATE_KBPS,224,192,160,144,128];
    for(const rate of rates){
      const label=`Preparing ${part.label} of ${totalParts} — keep this screen open`;
      const blob=await encodeAudioBufferForAnalysis(buffer,rate,part.audioStart,part.audioEnd,label);
      if(blob.size<=RUNPOD_RUN_RAW_SAFE_BYTES){
        const base=(file.name||'song').replace(/\.[^.]+$/,'');
        return {
          file:new File([blob],`${base}-${part.label}-analysis.mp3`,{
            type:'audio/mpeg',lastModified:file.lastModified||Date.now()
          }),
          bitrate:rate,prepared:true
        };
      }
    }
    throw new Error(`${part.label} could not be prepared small enough for a safe high-quality upload.`);
  }

  function makePendingPartGroup(file,signature){
    return {
      version:3,signature,
      name:file.name,type:file.type,size:file.size,lastModified:file.lastModified||0,
      submittedAt:Date.now(),segmented:true,
      parts:buildAnalysisPartPlan(file)
    };
  }

  async function submitPendingAnalysisParts(pending,key,file){
    const total=pending.parts.length;
    await cacheAudioForRecovery(file);

    for(let i=0;i<total;i++){
      const part=pending.parts[i];
      if(part.id)continue;

      aiStatus(`Preparing ${part.label} of ${total} — keep this screen open`,
               Math.max(2,Math.round((i/Math.max(1,total))*12)));
      const upload=await prepareAnalysisPartUpload(file,part,total);

      aiStatus(`Uploading ${part.label} of ${total} — keep this screen open`,
               Math.max(7,Math.round(((i+.45)/Math.max(1,total))*15)));
      const b64=await fileToBase64(upload.file);

      const submitted=await runPodFetch(
        `https://api.runpod.ai/v2/${encodeURIComponent(RUNPOD_ENDPOINT)}/run`,
        key,{
          method:'POST',
          body:JSON.stringify({input:{
            action:'analyse',
            audio_base64:b64,
            filename:upload.file.name,
            quality:'accuracy',
            return_bass_audio:true
          }})
        },1
      );

      const immediate=String(submitted?.status||'UNKNOWN').toUpperCase();
      if(['FAILED','CANCELLED','TIMED_OUT'].includes(immediate))
        throw new Error(`${part.label} was rejected by the analysis service (${immediate}).`);
      if(!submitted?.id)
        throw new Error(`${part.label} did not receive an analysis job number.`);

      part.id=submitted.id;
      part.uploadBitrate=upload.bitrate;
      part.submittedAt=Date.now();
      savePendingRunPodJob(pending);
    }

    aiStatus(`${total===1?'P1':'All parts'} sent — you can use other apps`,18);
    return pending;
  }

  async function collectPendingAnalysisParts(pending,key){
    const total=pending.parts.length;
    const results=[];
    for(let i=0;i<total;i++){
      const part=pending.parts[i];
      if(!part.id)throw new Error(`${part.label} has not been submitted yet.`);
      aiStatus(`Analysing ${part.label} of ${total} — you can use other apps`,
               Math.min(94,20+Math.round((i/Math.max(1,total))*70)));

      let current=await runPodFetch(
        `https://api.runpod.ai/v2/${encodeURIComponent(RUNPOD_ENDPOINT)}/status/${encodeURIComponent(part.id)}`,
        key,{method:'GET'},8
      );
      let st=String(current?.status||'UNKNOWN').toUpperCase();
      if(!['COMPLETED','FAILED','CANCELLED','TIMED_OUT'].includes(st)){
        current=await pollRunPodJob(key,part.id);
        st=String(current?.status||'UNKNOWN').toUpperCase();
      }
      if(st!=='COMPLETED')
        throw new Error(`${part.label} analysis finished with status ${st}.`);
      results.push(current);
    }
    return results;
  }

  function round3(v){return Math.round(Number(v)*1000)/1000;}

  function chooseCombinedSongContext(partMeta,outputs){
    const scaleVotes=new Map(),tempoValues=[],beats=[],meterVotes=new Map();
    let bestMeterPhase=0,bestGridConfidence=-1,tempoConfidenceTotal=0,keyConfidenceTotal=0;

    outputs.forEach((out,i)=>{
      const meta=partMeta[i];
      let scale=String(out?.song_scale||'').trim();
      if(!scale&&out?.song_key)scale=`${String(out.song_key).trim()} ${String(out.song_mode||'').trim()}`.trim();
      if(scale){
        const w=Math.max(.15,Number(out?.key_confidence)||.5)*Math.max(1,meta.coreEnd-meta.coreStart);
        scaleVotes.set(scale,(scaleVotes.get(scale)||0)+w);
        keyConfidenceTotal+=Number(out?.key_confidence)||0;
      }

      const bpm=Number(out?.tempo_bpm);
      if(Number.isFinite(bpm)&&bpm>0){
        tempoValues.push({
          bpm,
          confidence:Number(out?.tempo_confidence)||.5,
          duration:Math.max(1,Number(meta.coreEnd)-Number(meta.coreStart))
        });
        tempoConfidenceTotal+=Number(out?.tempo_confidence)||0;
      }

      (Array.isArray(out?.beat_times)?out.beat_times:[]).forEach(v=>{
        const global=Number(v)+Number(meta.audioStart||0);
        const inCore=global>=meta.coreStart-.04 &&
          (i===partMeta.length-1?global<=meta.coreEnd+.04:global<meta.coreEnd-.04);
        if(inCore&&Number.isFinite(global)&&global>=0)beats.push(global);
      });

      const meter=Math.max(1,Math.round(Number(out?.beats_per_bar)||4));
      const gridC=Number(out?.beat_grid_confidence)||.45;
      meterVotes.set(meter,(meterVotes.get(meter)||0)+gridC);
      if(gridC>bestGridConfidence){
        bestGridConfidence=gridC;
        bestMeterPhase=Math.max(0,Math.round(Number(out?.downbeat_phase)||0));
      }
    });

    let songScale='',bestScaleWeight=-1;
    for(const [scale,w] of scaleVotes){
      if(w>bestScaleWeight){bestScaleWeight=w;songScale=scale;}
    }

    // RC108: one 3-minute part can lock to double-time while the rest of the
    // song is at the true pulse. Only fold a high/low part when OTHER parts
    // clearly support the half/double family, then use a duration/confidence
    // weighted median so a short outro cannot outweigh five full parts.
    const tempoFamilyValues=tempoValues.map((item,index)=>{
      let bpm=Number(item.bpm);
      const others=tempoValues.filter((_,i)=>i!==index);
      const weightedSupport=(target)=>others.reduce((sum,o)=>{
        const obpm=Number(o.bpm);
        const close=Math.abs(obpm-target)/Math.max(target,1)<=.12;
        return sum+(close?Math.max(.15,Number(o.confidence)||.5)*Math.max(1,Number(o.duration)||1):0);
      },0);

      if(bpm>=150){
        const half=bpm/2;
        if(weightedSupport(half)>0)bpm=half;
      }else if(bpm<=60){
        const doubled=bpm*2;
        if(weightedSupport(doubled)>0)bpm=doubled;
      }
      return {...item,bpm};
    }).sort((a,b)=>a.bpm-b.bpm);

    let tempoBpm=null;
    if(tempoFamilyValues.length){
      const weights=tempoFamilyValues.map(x=>
        Math.max(.15,Number(x.confidence)||.5)*Math.max(1,Number(x.duration)||1));
      const totalWeight=weights.reduce((a,b)=>a+b,0);
      let cumulative=0;
      for(let i=0;i<tempoFamilyValues.length;i++){
        cumulative+=weights[i];
        if(cumulative>=totalWeight/2){
          tempoBpm=tempoFamilyValues[i].bpm;
          break;
        }
      }
    }

    let beatsPerBar=4,bestMeterWeight=-1;
    for(const [meter,w] of meterVotes){
      if(w>bestMeterWeight){bestMeterWeight=w;beatsPerBar=meter;}
    }

    beats.sort((a,b)=>a-b);
    const deduped=[];
    for(const b of beats){
      if(!deduped.length||Math.abs(b-deduped[deduped.length-1])>.08)deduped.push(round3(b));
    }

    return {
      song_scale:songScale,
      key_confidence:outputs.length?keyConfidenceTotal/outputs.length:null,
      tempo_bpm:tempoBpm,
      tempo_confidence:tempoValues.length?tempoConfidenceTotal/tempoValues.length:null,
      beat_times:deduped,
      beats_per_bar:beatsPerBar,
      downbeat_phase:bestMeterPhase,
      beat_grid_confidence:bestGridConfidence>=0?bestGridConfidence:null
    };
  }


  function dedupeSegmentBoundaryNotes(input){
    const sorted=(Array.isArray(input)?input:[]).slice()
      .sort((a,b)=>Number(a.start)-Number(b.start)||Number(a.end)-Number(b.end));
    const out=[];
    for(const raw of sorted){
      const note={...raw};
      let merged=false;
      for(let i=out.length-1;i>=0 && i>=out.length-4;i--){
        const prev=out[i];
        const startDelta=Math.abs(Number(note.start)-Number(prev.start));
        if(startDelta>.060)break;
        if(Number(note.midi)!==Number(prev.midi))continue;
        const overlap=Math.max(0,
          Math.min(Number(note.end),Number(prev.end))-
          Math.max(Number(note.start),Number(prev.start)));
        const shorter=Math.max(.001,
          Math.min(Number(note.end)-Number(note.start),
                   Number(prev.end)-Number(prev.start)));
        if(overlap<Math.min(.045,shorter*.45))continue;

        // Same attack seen by the two overlapping RunPod parts. Keep one note
        // with the strongest evidence and the full supported sustain.
        const stronger=(Number(note.confidence)||0)>(Number(prev.confidence)||0);
        prev.start=Math.min(Number(prev.start),Number(note.start));
        prev.end=Math.max(Number(prev.end),Number(note.end));
        prev.confidence=Math.max(Number(prev.confidence)||0,Number(note.confidence)||0);
        if(stronger){
          prev.isFill=note.isFill;
          prev.cloudMidi=note.cloudMidi;
          prev.source=note.source;
        }
        merged=true;
        break;
      }
      if(!merged)out.push(note);
    }
    return out;
  }

  async function applySegmentedRunPodResults(pending,finalDataList){
    if(!Array.isArray(finalDataList)||finalDataList.length!==pending.parts.length)
      throw new Error('Not all song parts returned an analysis result.');

    const outputs=finalDataList.map((finalData,i)=>{
      if(String(finalData?.status||'').toUpperCase()!=='COMPLETED')
        throw new Error(`${pending.parts[i].label} did not finish successfully.`);
      const out=finalData.output||{};
      if(!out.ok)throw new Error(out.error||out.warning||`${pending.parts[i].label} returned no usable result.`);
      return out;
    });

    applySongContext(chooseCombinedSongContext(pending.parts,outputs));

    const mergedNotes=[],parts=[];
    outputs.forEach((out,i)=>{
      const meta=pending.parts[i];
      const engineLabel=cloudVersionLabel(out.analysis_version);
      (Array.isArray(out.notes)?out.notes:[]).forEach(n=>{
        const rawMidi=Number(n.midi),midi=mapFreshCloudMidi(rawMidi);
        const localStart=Number(n.start),localEnd=Number(n.end);
        if(!Number.isFinite(localStart)||!Number.isFinite(localEnd)||localEnd<=localStart||!Number.isFinite(midi))return;
        const start=localStart+Number(meta.audioStart||0);
        const end=localEnd+Number(meta.audioStart||0);
        const keep=start>=Number(meta.coreStart)-.055 &&
          (i===pending.parts.length-1?start<=Number(meta.coreEnd)+.01:start<Number(meta.coreEnd)-.01);
        if(!keep)return;
        mergedNotes.push({
          midi:Math.round(midi),
          start:Math.max(0,start),
          end:Math.min(Number(buffer?.duration)||end,end),
          confidence:Number(n.confidence)||0,
          isFill:typeof n.is_fill==='boolean'?n.is_fill:undefined,
          cloudMidi:rawMidi,
          source:engineLabel
        });
      });

      parts.push({
        index:i,label:meta.label||`P${i+1}`,
        coreStart:Number(meta.coreStart)||0,coreEnd:Number(meta.coreEnd)||0,
        audioStart:Number(meta.audioStart)||0,audioEnd:Number(meta.audioEnd)||0,
        bassMime:String(out.bass_audio_mime||'audio/mpeg'),
        bassBase64:out.bass_audio_base64?String(out.bass_audio_base64):'',
        noBassMime:String(out.no_bass_audio_mime||'audio/mpeg'),
        noBassBase64:out.no_bass_audio_base64?String(out.no_bass_audio_base64):'',
        rehearsalVersion:String(out.rehearsal_version||''),
        bassBitrate:Number(out.bass_audio_bitrate_kbps)||null,
        noBassBitrate:Number(out.no_bass_audio_bitrate_kbps)||null
      });
    });

    const cleanMergedNotes=dedupeSegmentBoundaryNotes(mergedNotes);
    if(!cleanMergedNotes.length)throw new Error('Analysis completed but no reliable bass notes were returned.');

    analysisParts=parts;activeAnalysisPartIndex=0;renderTimelinePartTabs();
    notes=cleanMergedNotes;analysedBassNotes=cleanMergedNotes.map(n=>({...n}));
    offlineAnalysisReady=true;updatePracticeLayoutState(true);waveCacheDirty=true;rebuildSimpleTimeline._sig='';
    if(timelineScroll)timelineScroll.scrollLeft=0;

    await activateAnalysisPart(0,{seek:false});
    currentRehearsalVersion=String(parts[0]?.rehearsalVersion||'');
    drawAll();updateProjectButtons();

    return {
      count:cleanMergedNotes.length,
      partCount:parts.length,
      bassStemReady:parts.every(p=>!!p.bassBase64)
    };
  }

  async function analyseBassWithAI(){
    const file=activeAudioFile||fileInput.files?.[0];
    if(!buffer||!file||aiBusy)return;
    const key=getRunPodKey();
    if(!key){aiStatus('Analysis cancelled · API key not entered',0);return;}

    const forceFreshAnalysis=!!offlineAnalysisReady||(Array.isArray(notes)&&notes.length>0);
    aiBusy=true;aiAnalyse.disabled=true;aiAnalyse.textContent='In Progress.....';
    aiAnalyse.setAttribute('aria-busy','true');
    const signature=cloudFileSignature(file);

    try{
      let pending=readPendingRunPodJob();
      const matching=!!(pending?.signature===signature&&Array.isArray(pending?.parts)&&pending.parts.length);

      if(forceFreshAnalysis){clearPendingRunPodJob();pending=null;}
      if(!pending||!matching){
        pending=makePendingPartGroup(file,signature);
        savePendingRunPodJob(pending);
      }

      await submitPendingAnalysisParts(pending,key,file);
      const finalParts=await collectPendingAnalysisParts(pending,key);
      const result=await applySegmentedRunPodResults(pending,finalParts);
      clearPendingRunPodJob();

      aiStatus(
        `Analysis ready · ${result.count} bass notes · Bb0–G3 · ${result.partCount} ${result.partCount===1?'part':'parts'}${result.bassStemReady?' · clean Bass Track ready':' · some Bass Track audio unavailable'}`,
        100
      );
    }catch(err){
      console.error('Bass analysis failure',err);
      if(err?.httpStatus===401){
        forgetRunPodKey();
        aiStatus('The analysis service API key was rejected. Tap Analyse Bass and paste your current key again.',0);
      }else{
        aiStatus(`Analysis error: ${String(err?.message||err)}`,0);
      }
    }finally{
      aiBusy=false;aiAnalyse.disabled=!buffer;
      aiAnalyse.removeAttribute('aria-busy');
      updatePracticeLayoutState(true);
    }
  }

  async function resumeSavedRunPodAnalysis(){
    if(pendingResumeBusy||aiBusy)return false;
    let pending=readPendingRunPodJob();
    if(!pending?.signature||!Array.isArray(pending?.parts)||!pending.parts.length)return false;
    const key=storedRunPodKey();
    if(!key)return false;

    pendingResumeBusy=true;aiBusy=true;
    if(aiAnalyse){aiAnalyse.disabled=true;aiAnalyse.textContent='In Progress.....';aiAnalyse.setAttribute('aria-busy','true');}
    try{
      if(!buffer||!activeAudioFile||cloudFileSignature(activeAudioFile)!==pending.signature){
        const saved=await getRecoveryAudio(pending.signature);
        if(!saved?.blob){
          aiStatus('Previous analysis is saved. Re-open the same audio file to collect the result.',12);
          return false;
        }
        const restored=new File(
          [saved.blob],saved.name||pending.name||'audio.mp3',
          {type:saved.type||pending.type||'audio/mpeg',lastModified:Number(saved.lastModified)||Date.now()}
        );
        const ok=await loadAudioFile(restored,{cacheForRecovery:false,recoveryRestore:true});
        if(!ok)return false;
      }

      pending=readPendingRunPodJob()||pending;
      await submitPendingAnalysisParts(pending,key,activeAudioFile);
      const finalParts=await collectPendingAnalysisParts(pending,key);
      const result=await applySegmentedRunPodResults(pending,finalParts);
      clearPendingRunPodJob();

      aiStatus(
        `Analysis ready · ${result.count} bass notes · Bb0–G3 · ${result.partCount} ${result.partCount===1?'part':'parts'}${result.bassStemReady?' · clean Bass Track ready':' · some Bass Track audio unavailable'}`,
        100
      );
      return true;
    }catch(err){
      console.error('Saved analysis recovery failed',err);

  async function buildOfflineBassTrack(buffer){
    if(!buffer || offlineAnalysisRunning) return;
    offlineAnalysisRunning=true; offlineAnalysisReady=false; analysedBassNotes=[];
    if(analysisBadge){analysisBadge.classList.add('on');analysisProgress.value=0;analysisText.textContent='Bass-first analysis…'}

    try{
      const sr=buffer.sampleRate,ch=buffer.numberOfChannels,mono=new Float32Array(buffer.length);
      for(let c=0;c<ch;c++){const d=buffer.getChannelData(c);for(let i=0;i<buffer.length;i++)mono[i]+=d[i]/ch}

      const hop=Math.max(512,Math.round(sr*.080));
      const win=Math.max(4096,Math.round(sr*.220));
      const minMidi=28,maxMidi=52; // E1 through E3: physical bass-first search
      const frames=[],twoPi=2*Math.PI;

      function tonePower(start,n,f){
        const w=twoPi*f/sr,coeff=2*Math.cos(w);
        let s0=0,s1=0,s2=0,en=0;
        for(let j=0;j<n;j+=2){
          const ww=.5-.5*Math.cos(twoPi*j/(n-1)),v=mono[start+j]*ww;
          s0=v+coeff*s1-s2;s2=s1;s1=s0;en+=v*v;
        }
        return Math.max(0,s1*s1+s2*s2-coeff*s1*s2)/(en+1e-12);
      }

      const total=Math.max(1,Math.floor((mono.length-win)/hop));
      let previousMidi=null;
      for(let fi=0,start=0;start+win<mono.length;fi++,start+=hop){
        let rms=0,peak=0;
        for(let j=0;j<win;j+=4){const a=Math.abs(mono[start+j]);rms+=a*a;if(a>peak)peak=a}
        rms=Math.sqrt(rms/Math.ceil(win/4)); const crest=peak/(rms+1e-9);

        const candidates=[];
        if(rms>.0022){
          for(let m=minMidi;m<=maxMidi;m++){
            const f=440*Math.pow(2,(m-69)/12);
            const p1=tonePower(start,win,f),p2=tonePower(start,win,f*2),
                  p3=f*3<1000?tonePower(start,win,f*3):0,
                  p4=f*4<1000?tonePower(start,win,f*4):0;

            let support=(p2>.045?1:0)+(p3>.030?1:0)+(p4>.020?1:0);
            // Fundamental dominates. Upper partials confirm a note but cannot become
            // a new pitch merely because vocals/guitar are strong there.
            let score=3.35*p1+1.05*p2+.62*p3+.32*p4;

            // Prefer the lower physical fundamental when its harmonic ladder explains
            // an upper candidate. This is the central RC9 change.
            if(m>=40){
              const sub=tonePower(start,win,f/2);
              if(sub>.045 && sub>p1*.28) score*=.42;
            }
            if(m>=47){ // B2-E3: possible, but demand stronger fundamental evidence.
              if(p1<.085 || support<2) score*=.50;
            }
            if(crest>8 && support<2) score*=.42;
            if(support===0) score*=.38; else if(support===1) score*=.72;

            // Continuity is evidence for a bass line, not a hard lock.
            if(previousMidi!==null){
              const jump=Math.abs(m-previousMidi);
              if(jump===0)score*=1.10;
              else if(jump<=2)score*=1.04;
              else if(jump>=7)score*=.78;
              else if(jump>=12)score*=.62;
            }
            candidates.push({midi:m,score,p1,support});
          }
        }
        candidates.sort((a,b)=>b.score-a.score);
        const best=candidates[0],second=candidates[1];
        let midi=null,conf=0;
        if(best){
          const dominance=best.score/((second?.score||0)+1e-12); conf=Math.min(2,dominance);
          const floor=best.midi>=47?.075:.045;
          if(best.p1>floor && best.support>=1 && dominance>1.012) midi=best.midi;
        }
        if(midi!==null)previousMidi=midi;
        frames.push({t:start/sr,midi,conf,rms});

        if(fi%30===0){
          if(analysisProgress)analysisProgress.value=Math.min(95,100*fi/total);
          await new Promise(r=>setTimeout(r,0));
        }
      }

      // Viterbi-like local path clean-up: choose one persistent pitch trajectory.
      // Isolated frames must agree with neighbours; genuine short transitions survive.
      const path=frames.map(f=>f.midi);
      for(let pass=0;pass<2;pass++){
        for(let i=2;i<path.length-2;i++){
          const m=path[i];
          const neighbours=[path[i-2],path[i-1],path[i+1],path[i+2]].filter(v=>v!==null);
          if(m===null){
            if(neighbours.length>=3 && neighbours.filter(v=>v===neighbours[0]).length>=3)path[i]=neighbours[0];
            continue;
          }
          const same=neighbours.filter(v=>v===m).length;
          if(same===0 && neighbours.length>=3){
            const counts=new Map();for(const v of neighbours)counts.set(v,(counts.get(v)||0)+1);
            let bm=null,bc=0;for(const [v,c] of counts)if(c>bc){bm=v;bc=c}
            if(bc>=3)path[i]=bm;
          }
        }
      }

      // Segment into one monophonic note at a time.
      const raw=[];let cur=null,st=0;
      for(let i=0;i<=path.length;i++){
        const m=i<path.length?path[i]:null,t=i<frames.length?frames[i].t:buffer.duration;
        if(m!==cur){
          if(cur!==null && t-st>=.14)raw.push({midi:cur,start:st,end:t});
          cur=m;st=t;
        }
      }
      const merged=[];
      for(const n of raw){
        const p=merged[merged.length-1];
        if(p&&p.midi===n.midi&&n.start-p.end<=.20)p.end=n.end;
        else merged.push({...n});
      }

      // Display mapping: E1-B1 lifts one octave; C2-E3 stays distinct.
      analysedBassNotes=merged.map(n=>{
        let m=n.midi;while(m<22)m+=12;while(m>55)m-=12;if(m<22)m+=12;
        return {midi:m,start:n.start,end:n.end};
      });

      offlineAnalysisReady=true;notes=analysedBassNotes.map(n=>({...n}));updatePracticeLayoutState(true);waveCacheDirty=true;
      if(analysisProgress)analysisProgress.value=100;
      if(analysisText)analysisText.textContent=`Bass-first track ready · ${notes.length} notes`;
      setTimeout(()=>analysisBadge?.classList.remove('on'),1500);if(timelineScroll)timelineScroll.scrollLeft=0;drawAll();
    }catch(err){
      console.error('Bass-first analysis failed',err);
      if(analysisText)analysisText.textContent='Live detector fallback';
      setTimeout(()=>analysisBadge?.classList.remove('on'),1800);
    }finally{offlineAnalysisRunning=false}
  }

  function detectPitch(){
    if(!analyser || !playing) return null;

    /*
      RC3 Balanced Accuracy detector.
      Priority: preserve the note accuracy/responsiveness of RC1 while adding
      modest kick/snare rejection. We intentionally avoid the aggressive
      autocorrelation/majority gates used in RC2 because they removed legitimate
      bass notes and could pull the detected pitch toward the wrong harmonic.
    */
    const bins=analyser.frequencyBinCount;
    const spec=new Float32Array(bins);
    analyser.getFloatFrequencyData(spec);
    const sr=ctx.sampleRate, binHz=sr/analyser.fftSize;
    const threshold=Number(confidence?.value||74)/100;

    // Analyse neighbouring bass octaves too. Notes are normalised by octave into the visible Bb0-G3 range
    // after the most credible musical pitch has been selected.
    const minMidi=22, maxMidi=67; // analyse Bb0 through G4, then fold only if outside the Bb0-G3 practice view

    function dbAt(freq){
      const k=Math.round(freq/binHz);
      if(k<1 || k>=bins-1) return -140;
      return Math.max(spec[k-1],spec[k],spec[k+1]);
    }
    function lin(db){ return Math.pow(10,db/20); }

    // Keep the strongest octave candidate for each of the 12 pitch classes.
    const pcBest=Array.from({length:12},()=>null);

    for(let m=minMidi;m<=maxMidi;m++){
      const f=440*Math.pow(2,(m-69)/12);
      const fund=dbAt(f);
      if(fund<-78) continue;

      // RC1-style harmonic score: musical bass fundamentals normally have a
      // useful 2nd/3rd harmonic even when the fundamental itself is not dominant.
      const h2=dbAt(f*2), h3=dbAt(f*3), h4=dbAt(f*4), h5=dbAt(f*5);
      let score=1.8*lin(fund)
               +1.15*lin(h2)
               +0.82*lin(h3)
               +0.58*lin(h4)
               +0.42*lin(h5);

      const upper=Math.max(h2,h3);
      if(fund < upper-18) score*=0.58;

      // If this candidate is actually an upper harmonic of a lower bass
      // fundamental, reduce its score. This targets the common "one bass note
      // creates several piano notes" problem without rejecting the real note.
      const sub2=dbAt(f/2), sub3=dbAt(f/3);
      if(f/2>=28 && sub2>fund-14) score*=0.68;
      if(f/3>=28 && sub3>fund-11) score*=0.82;

      // Gentle fundamental bias: bass fundamentals are normally more useful
      // than equally plausible upper partials, but octave-3 notes remain valid.
      score *= (1 + Math.max(0, 0.10*(180-f)/180));

      let harmonicSupport=0;
      if(h2>fund-27 && h2>-80) harmonicSupport++;
      if(h3>fund-33 && h3>-84) harmonicSupport++;
      if(h4>fund-38 && h4>-88) harmonicSupport++;

      // Softly penalise weak harmonic ladders rather than discarding them.
      // This keeps short/muted/plucked bass notes that RC2 was losing.
      if(harmonicSupport===0) score*=0.58;
      else if(harmonicSupport===1) score*=0.82;

      const pc=((m%12)+12)%12;
      if(!pcBest[pc] || score>pcBest[pc].score){
        pcBest[pc]={midi:m,score,fund,harmonicSupport,h2,h3,h4};
      }
    }

    const candidates=pcBest.filter(Boolean).sort((a,b)=>b.score-a.score);
    if(!candidates.length) return null;

    const best=candidates[0];
    const second=candidates[1]?.score||0;
    if(best.fund<-74) return null;

    // RC1-style confidence: keep this permissive enough not to lose real notes.
    const dominance=best.score/(second+1e-12);
    const domNeeded=1.012 + (threshold-.55)*0.10;
    if(dominance<domNeeded) return null;

    // Light percussion rejection only. A strong transient is rejected solely
    // when it ALSO lacks a convincing harmonic ladder. Genuine plucked bass
    // attacks therefore survive.
    let flux=0, fluxN=0;
    const maxBassBin=Math.min(bins-1,Math.floor(460/binHz));
    if(prevBassSpec && prevBassSpec.length===maxBassBin){
      for(let k=2;k<maxBassBin;k++){
        const now=lin(spec[k]), before=prevBassSpec[k];
        if(now>before) flux += now-before;
        fluxN++;
      }
      flux=fluxN?flux/fluxN:0;
    }
    const snap=new Float32Array(maxBassBin);
    for(let k=0;k<maxBassBin;k++) snap[k]=lin(spec[k]);
    prevBassSpec=snap;
    lastSpectralFlux=flux;

    if(strictBass?.checked){
      // Only reject obvious percussive attacks; do not gate sustained bass.
      if(flux>0.00062 && best.harmonicSupport===0) return null;
      if(flux>0.00082 && best.harmonicSupport<2 && best.fund<-48) return null;
    }

    let midi=best.midi;

    // Avoid octave-harmonic mistakes, but do not force an octave switch unless
    // the lower candidate itself has credible fundamental + harmonic evidence.
    if(lowerOct.checked && midi>=36){
      const lowMidi=midi-12;
      if(lowMidi>=minMidi){
        const lowF=440*Math.pow(2,(lowMidi-69)/12);
        const lowFund=dbAt(lowF), lowH2=dbAt(lowF*2), lowH3=dbAt(lowF*3);
        if(lowFund>-69 && lowFund>best.fund-13 && lowH2>-80 && lowH3>-86){
          midi=lowMidi;
        }
      }
    }

    // Compare pitch classes, not physical octaves, for jump suppression.
    // This keeps the one-octave practice display stable without hiding genuine
    // octave movement in the recording.
    const folded=36+((midi%12)+12)%12;
    if(strictBass?.checked && lastAcceptedMidi!==null){
      const jump=Math.abs(midi-lastAcceptedMidi);
      const pcJump=Math.min(Math.abs(folded-(36+((lastAcceptedMidi%12)+12)%12)),
                            12-Math.abs(folded-(36+((lastAcceptedMidi%12)+12)%12)));
      if(jump>12 && pcJump>5 && dominance<1.12 && best.harmonicSupport<2) return null;
    }

    // RC101 Bb0–G3 practice view. Fold by whole octaves only, preserving pitch class.
    while(midi < 22) midi += 12;
    while(midi > 55) midi -= 12;
    if(midi < 22) midi += 12;

    return {
      freq:440*Math.pow(2,(midi-69)/12),
      midi,
      confidence:dominance,
      rms:1
    };
  }

  function recordNote(n){
    if(!n || n.end<=n.start) return;
    const existing=notes.find(x=>x.midi===n.midi && Math.abs(x.start-n.start)<0.09 && Math.abs(x.end-n.end)<0.12);
    if(existing){existing.start=Math.min(existing.start,n.start);existing.end=Math.max(existing.end,n.end);return;}
    notes.push(n);
    if(notes.length>5000) notes.splice(0,notes.length-5000);
  }

  function updateDetectedNote(t){
    const d=detectPitch();
    const minStable=(Number(stableMs?.value||120))/1000;
    const switchStable=Math.max(0.18,minStable*1.35); // harder to change than to start
    const releaseGrace=0.22;                          // bridge tiny detection drop-outs

    if(!d){
      candidateMidi=null;
      candidateSince=0;
      pitchHistory=[];
      switchMidi=null;
      switchSince=0;

      // Hold the current bass note briefly through drum/vocal interference or
      // analyser drop-outs. This prevents one sustained bass note fragmenting
      // into multiple short notes.
      if(lastNoteMidi!==null && t-lastDetectedAt>releaseGrace){
        if(lastDetectedAt-noteStart>=minStable){
          recordNote({midi:lastNoteMidi,start:noteStart,end:lastDetectedAt});
        }
        lastAcceptedMidi=lastNoteMidi;
        lastNoteMidi=null;
        noteStart=0;
      }
      if(noteName)noteName.textContent='—';
      if(freqText)freqText.textContent='— Hz';
      return;
    }

    // Use a short MODE vote, not a numeric median. A median can favour a
    // musically unrelated middle pitch when harmonics alternate.
    pitchHistory.push(d.midi);
    if(pitchHistory.length>5) pitchHistory.shift();
    const counts=new Map();
    for(const m of pitchHistory) counts.set(m,(counts.get(m)||0)+1);
    let voted=d.midi, bestCount=0;
    for(const [m,c] of counts){
      if(c>bestCount){voted=m;bestCount=c}
    }

    // Need only two agreeing frames to begin a note, preserving RC3/RC4
    // responsiveness while removing one-frame vocal/drum artefacts.
    if(bestCount<2 && pitchHistory.length>=3) return;

    if(lastNoteMidi===null){
      if(candidateMidi!==voted){
        candidateMidi=voted;
        candidateSince=t;
        return;
      }
      if(t-candidateSince<minStable) return;

      lastNoteMidi=voted;
      lastAcceptedMidi=voted;
      noteStart=candidateSince;
      lastDetectedAt=t;
      switchMidi=null; switchSince=0;
      if(noteName)noteName.textContent=midiName(voted);
      if(freqText)freqText.textContent=`${d.freq.toFixed(1)} Hz`;
      return;
    }

    // Same note: extend it continuously. One real bass note stays one piano bar.
    if(voted===lastNoteMidi){
      lastDetectedAt=t;
      switchMidi=null;
      switchSince=0;
      candidateMidi=voted;
      candidateSince=t;
      if(noteName)noteName.textContent=midiName(voted);
      if(freqText)freqText.textContent=`${d.freq.toFixed(1)} Hz`;
      return;
    }

    // Different detected pitch: do NOT switch immediately. Require the new note
    // to persist substantially longer than the initial-start threshold.
    if(switchMidi!==voted){
      switchMidi=voted;
      switchSince=t;
      return;
    }

    if(t-switchSince<switchStable){
      // Keep displaying/recording the established bass note while the challenger
      // proves itself. This rejects harmonics, vocals and kick-related flicker.
      return;
    }

    // Commit one clean monophonic transition.
    if(t-noteStart>=minStable){
      recordNote({midi:lastNoteMidi,start:noteStart,end:switchSince});
    }
    lastAcceptedMidi=lastNoteMidi;
    lastNoteMidi=voted;
    noteStart=switchSince;
    lastDetectedAt=t;
    candidateMidi=voted;
    candidateSince=t;
    switchMidi=null;
    switchSince=0;
    if(noteName)noteName.textContent=midiName(voted);
    if(freqText)freqText.textContent=`${d.freq.toFixed(1)} Hz`;
  }


  // ---------- Drawing ----------
  function resizeCanvas(c,maxBackingWidth=32768){
    const r=c.getBoundingClientRect(), dpr=Math.min(2,window.devicePixelRatio||1);
    const naturalW=Math.max(1,Math.round(r.width*dpr));
    const w=Math.max(1,Math.min(maxBackingWidth,naturalW));
    const h=Math.max(1,Math.round(r.height*dpr));
    if(c.width!==w||c.height!==h){c.width=w;c.height=h}
    return {w,h,dpr,cssWidth:r.width,naturalW};
  }

  // ---------- RC113 shared adjustable master timeline ----------
  // One geometry source controls ruler, waveform, Notes View, Bass View and repeat cells.
  const TIMELINE_CELL_OPTIONS = [1,2,3,4,5,10,15,20,25,30];
  let TIMELINE_CELL_SECONDS = 2; // Requested default.
  const TIMELINE_MAJOR_SECONDS = 20;
  function isTimelineMajor(sec){
    const n=Number(sec)||0;
    return Math.abs(n/TIMELINE_MAJOR_SECONDS-Math.round(n/TIMELINE_MAJOR_SECONDS))<0.001;
  }
  function timelineCellWidth(){
    const css=getComputedStyle(document.documentElement).getPropertyValue('--rc50-cell-w').trim();
    const n=parseFloat(css); return Number.isFinite(n)&&n>60?n:118;
  }
  function timelineWidthCss(){
    if(!buffer||!buffer.duration)return Math.max(320,window.innerWidth||360);
    return Math.max(320,(buffer.duration/TIMELINE_CELL_SECONDS)*timelineCellWidth());
  }
  function updateTimelineGeometry(){
    if(!buffer)return;
    const px=timelineWidthCss();
    document.documentElement.style.setProperty('--timeline-width',px+'px');
  }

  function setTimelineCellSeconds(value,{clearSelection=true,rebuild=true}={}){
    const next=Number(value);
    if(!TIMELINE_CELL_OPTIONS.includes(next))return false;

    const changed=next!==TIMELINE_CELL_SECONDS;
    const hadTimeframeSelection=selectedTimeframes.size>0 || timeframeLoopMode;
    TIMELINE_CELL_SECONDS=next;
    if(timelineSplitSelect)timelineSplitSelect.value=String(next);

    if(timeRuler)timeRuler.setAttribute('aria-label',`Timeline split into ${next}-second repeat cells`);
    if(noteLane)noteLane.setAttribute('aria-label',`Detected bass notes grouped into ${next}-second time cells`);
    if(bassTimeScroll)bassTimeScroll.setAttribute('aria-label',`Clickable ${next}-second repeat timeline`);

    if(clearSelection && changed){
      selectedTimeframes.clear();
      timeframeQueue=[];
      timeframeQueueIndex=0;
      timeframeLoopMode=false;
      if(hadTimeframeSelection && !loopEnabled && !multiSectionMode){
        loopStart=null;
        loopEnd=null;
      }
      updateLoopUI();
    }

    if(!rebuild)return true;

    waveCacheDirty=true;
    rebuildSimpleTimeline._sig='';
    if(buffer){
      updateTimelineGeometry();
      rebuildSimpleTimeline();
      rebuildBassTimeRuler();
      refreshTimeframeSelectionUI();
      drawWaveform();
      drawRoll();
      updateSongInfo(currentTime());
      updateBassTimePlayhead(currentTime());
      requestAnimationFrame(()=>scrollTimelineToTime(currentTime()));
    }
    return true;
  }
  function timelineX(sec,w){
    if(!buffer||!buffer.duration)return 0;
    return clamp(sec/buffer.duration,0,1)*w;
  }
  function timelineTicks(){
    if(!buffer)return [];
    const ticks=[];
    for(let s=0;s<=buffer.duration+.001;s+=TIMELINE_CELL_SECONDS)ticks.push(s);
    return ticks;
  }
  function drawTimeGrid(g,w,y1,y2,labelY){
    const ticks=timelineTicks();
    g.save();
    g.font='30px Arial, sans-serif';
    g.textBaseline='middle';
    for(const s of ticks){
      const x=timelineX(s,w),major=isTimelineMajor(s);
      g.strokeStyle=major?'rgba(118,154,190,.58)':'rgba(118,154,190,.28)';
      g.lineWidth=major?1.4:1;
      g.beginPath();g.moveTo(Math.round(x)+.5,y1);g.lineTo(Math.round(x)+.5,y2);g.stroke();
      if(labelY!=null){
        g.fillStyle=major?'#d7e5f3':'#a5b8cb';
        const label=fmtShort(s),tw=g.measureText(label).width;
        const lx=clamp(x+5,3,Math.max(3,w-tw-3));g.fillText(label,lx,labelY);
      }
    }
    g.restore();
  }

  function rebuildWaveCache(w,h){
    waveCache.width=w;waveCache.height=h;const g=waveCache.getContext('2d');
    g.clearRect(0,0,w,h);g.fillStyle='#081321';g.fillRect(0,0,w,h);
    if(!buffer)return;
    g.strokeStyle='#315173';g.lineWidth=1;
    const data=buffer.getChannelData(0),step=Math.max(1,Math.floor(data.length/w)),mid=h/2;
    g.beginPath();
    for(let x=0;x<w;x++){
      let mn=1,mx=-1,base=x*step;
      for(let j=0;j<step&&base+j<data.length;j++){const v=data[base+j];if(v<mn)mn=v;if(v>mx)mx=v}
      g.moveTo(x,mid+mn*mid*.72);g.lineTo(x,mid+mx*mid*.72);
    }
    g.stroke();
    // RC52: the dedicated ruler above the waveform owns all timestamp text.
    // The waveform only carries the shared 4-second grid so it stays visually clean.
    drawTimeGrid(g,w,0,h,null);
    waveCacheDirty=false;
  }
  function drawWaveform(){
    if(!buffer)return;
    const {w,h}=resizeCanvas(wave,16384),g=wave.getContext('2d');
    if(waveCacheDirty||waveCache.width!==w||waveCache.height!==h)rebuildWaveCache(w,h);
    g.clearRect(0,0,w,h);g.drawImage(waveCache,0,0);
    const px=timelineX(currentTime(),w);g.strokeStyle='#ffd166';g.lineWidth=2;g.beginPath();g.moveTo(px,0);g.lineTo(px,h);g.stroke();
  }

  function drawRoll(){
    if(!roll)return;
    const {w,h}=resizeCanvas(roll), g=roll.getContext('2d');
    g.clearRect(0,0,w,h); g.fillStyle='#081321'; g.fillRect(0,0,w,h);
    if(!buffer) return;

    const t=currentTime();
    const left=0, right=Math.max(.001,buffer.duration); // exact same song timeline as waveform
    const rulerH=Math.max(30,Math.min(38,h*.055));

  function classifyTimelineNotes(){
    const src=notes.slice().sort((a,b)=>a.start-b.start);
    if(!src.length)return [];
    return src.map((n,i)=>{
      const dur=Math.max(.01,n.end-n.start),prev=src[i-1],next=src[i+1];
      const closePrev=prev && n.start-prev.end<=.28;
      const closeNext=next && next.start-n.end<=.28;
      // Conservative fill labelling: a short passing/ornamental note, not simply every short note.
      // Cloud V5 already classifies main notes vs fills. Preserve that decision
      // when it is present; use the RC52 heuristic only for legacy/local notes.
      if(typeof n.isFill==='boolean') return {...n,isFill:n.isFill};
      const passingBetweenSame=prev&&next&&prev.midi===next.midi&&n.midi!==prev.midi&&dur<=.65&&closePrev&&closeNext;
      const veryShortPassing=dur<=.24&&prev&&next&&n.midi!==prev.midi&&n.midi!==next.midi&&closePrev&&closeNext;
      return {...n,isFill:!!(passingBetweenSame||veryShortPassing)};
    });
  }
