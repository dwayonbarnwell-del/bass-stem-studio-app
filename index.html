      timeRuler.appendChild(d);
    }

    const events=classifyTimelineNotes();
    const buckets=Array.from({length:cellCount},()=>[]);
    for(const n of events){
      // RC113: Timeline notation is attack-based. A note appears only in the
      // selected interval where that note was actually struck/started. Sustained
      // notes are never copied into the next cell.
      const idx=clamp(Math.floor(Number(n.start)/TIMELINE_CELL_SECONDS),0,cellCount-1);
      buckets[idx].push(n);
    }

    // Accuracy-first display cleanup. Preserve every fill/passing event.
    // Only merge a same-pitch MAIN-note fragment when it is essentially the
    // same event split by a tiny detector gap (<= 80 ms).
    const displayBuckets=buckets.map(bucket=>{
      const out=[];
      for(const n of bucket.sort((a,b)=>a.start-b.start)){
        const p=out[out.length-1];

  function updateSimpleTimeline(t){

      // is written. A sustained note can continue sounding beyond the cell,
      // but it is not relisted or highlighted as a new note in the next cell.
      const cells=[...noteLane.querySelectorAll('.note-time-cell')];
      const atSongEnd=!!buffer && Math.abs(Number(t)-Number(buffer.duration))<.002;
      const cell=cells.find(x=>{
        const s=Number(x.dataset.start),e=Number(x.dataset.end);
        return Number(t)>=s && (Number(t)<e || (atSongEnd && Number(t)<=e+.002));
      });

  async function decodeBase64AudioBuffer(base64){
    ensureCtx();
    const bytes=base64ToUint8Array(base64);
    const ab=bytes.buffer.slice(bytes.byteOffset,bytes.byteOffset+bytes.byteLength);
    return await ctx.decodeAudioData(ab.slice(0));

  async function renderSeparatedBassForExport(){
    if(!buffer)throw new Error('Import a song first.');
    if(!hasExportableSeparatedBass())
      throw new Error('Run Analyse Bass first so the genuine separated Bass Track is available.');

    // Legacy/single-part result.
    if(!analysisParts.length){
      return await decodeBase64AudioBuffer(bassStemBase64);
    }

    const sampleRate=Math.round(buffer.sampleRate||44100);
    const length=Math.max(1,Math.ceil(Number(buffer.duration)*sampleRate));
    const off=new OfflineAudioContext(1,length,sampleRate);

    for(let i=0;i<analysisParts.length;i++){
      const part=analysisParts[i];
      if(!part?.bassBase64)continue;
      const decoded=await decodeBase64AudioBuffer(String(part.bassBase64));
      const src=off.createBufferSource();
      const gain=off.createGain();
      src.buffer=decoded;
      src.connect(gain).connect(off.destination);

      const audioStart=Math.max(0,Number(part.audioStart)||0);
      const audioEnd=Math.min(Number(buffer.duration),
        Number(part.audioEnd)||audioStart+decoded.duration);
      const coreStart=Math.max(audioStart,Number(part.coreStart)||audioStart);
      const coreEnd=Math.min(audioEnd,Number(part.coreEnd)||audioEnd);
      const playable=Math.min(decoded.duration,Math.max(0,audioEnd-audioStart));
      if(playable<=.02)continue;

      // Use the analysis overlap as a crossfade rather than hard-cutting the
      // independently separated P parts at their core boundaries.
      gain.gain.setValueAtTime(i===0?1:0,audioStart);
      if(i>0 && coreStart>audioStart+.005)
        gain.gain.linearRampToValueAtTime(1,coreStart);
      else
        gain.gain.setValueAtTime(1,audioStart);

      if(i<analysisParts.length-1 && audioEnd>coreEnd+.005){
        gain.gain.setValueAtTime(1,coreEnd);
        gain.gain.linearRampToValueAtTime(0,audioEnd);
      }

      src.start(audioStart,0,playable);
    }
    return await off.startRendering();
  }

  function compactDigitsToSeconds(raw){
    const digits=String(raw||'').replace(/\D/g,'');
    if(!digits)return NaN;
    if(digits.length<=2)return Number(digits);
    const mins=Number(digits.slice(0,-2)||0);
    const secs=Number(digits.slice(-2)||0);
    if(!Number.isFinite(mins)||!Number.isFinite(secs))return NaN;
    // Allow natural carry, e.g. 075 -> 1:15, while 120 -> 1:20.
    return mins*60+secs;
  }

  function formatCompactTimeDigits(raw){
    const seconds=compactDigitsToSeconds(raw);
    if(!Number.isFinite(seconds))return '';
    const whole=Math.max(0,Math.floor(seconds));
    const mins=Math.floor(whole/60);
    const secs=whole%60;
    return `${mins}:${String(secs).padStart(2,'0')}`;
  }

  function parseUserTime(v){
    v=String(v||'').trim();
    if(!v) return NaN;
    if(v.includes(':')){
      const p=v.split(':').map(Number);
      if(p.some(Number.isNaN)) return NaN;
      if(p.length===2) return p[0]*60+p[1];
      if(p.length===3) return p[0]*3600+p[1]*60+p[2];
      return NaN;
    }
    // Bare digits use MMSS entry, not raw seconds:
    // "26" = 0:26 and "120" = 1:20.
    return compactDigitsToSeconds(v);
  }

  }

<script>
(() => {
  const topRow = document.querySelector('.transport-main');
  const bottomRow = document.querySelector('.loop-range-row');
  if (!topRow || !bottomRow) return;

  let syncing = false;
  const mirror = (source, target) => {
    if (syncing) return;
    syncing = true;
    target.scrollLeft = source.scrollLeft;
    requestAnimationFrame(() => { syncing = false; });
  };

  topRow.addEventListener('scroll', () => mirror(topRow, bottomRow), {passive:true});
  bottomRow.addEventListener('scroll', () => mirror(bottomRow, topRow), {passive:true});
})();
</script>

(() => {
  const root = document.documentElement;

  const input = document.getElementById('fontSizeInput');
  const auto = document.getElementById('fontSizeAuto');
  const label = document.getElementById('displayDeviceLabel');
  if (!down || !up || !input || !auto || !label) return;

  const clamp = value => Math.max(1, Math.min(100, Math.round(Number(value) || state.autoSize)));
  const key = `bassStemStudioFontPxV2:${state.mode}`;
  let current = clamp(state.selected);

  function refreshLabel(){
    label.textContent = state.mode === 'mobile' ? 'Mobile' : 'Desktop';
    auto.title = `Use automatic ${state.mode} size (${state.autoSize} px)`;
  }

  function apply(value, save = true){
    current = clamp(value);
    root.style.setProperty('--ui-font-size', `${current}px`);
    root.dataset.fontPx = String(current);
    input.value = String(current);
    if (save) {
      try { localStorage.setItem(key, String(current)); } catch (_) {}
    }
    // Existing canvas and timeline drawing already listens to resize, so this
    // keeps waveform and note geometry aligned after a manual size change.
    requestAnimationFrame(() => window.dispatchEvent(new Event('resize')));
  }

  down.addEventListener('click', () => apply(current - 1));
  up.addEventListener('click', () => apply(current + 1));
  input.addEventListener('change', () => apply(input.value));
  input.addEventListener('keydown', event => {
    if (event.key === 'Enter') { event.preventDefault(); apply(input.value); input.blur(); }
  });
  auto.addEventListener('click', () => {
    try { localStorage.removeItem(key); } catch (_) {}
    apply(state.autoSize, false);
  });

  refreshLabel();
  apply(current, false);
})();
</script>

/* RC128 hosted PWA shell: register the root service worker without changing app logic. */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
