name: Verify RC197 batch and preserve existing analysis
on:
  push:
    branches:
      - fix/batch-deferred-retry-rc197
    paths:
      - scripts/apply_batch_rc197.cjs
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/batch-deferred-retry-rc197
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate small source updates into current app
        run: node scripts/apply_batch_rc197.cjs
      - name: Non-billable regression tests
        run: |
          node tests/library_rc195.cjs
          node tests/save_import_rc164.cjs
          node tests/batch_rc196.cjs
          node tests/batch_rc197.cjs
      - name: Commit validated index.html to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Integrate safe batch recovery into current app"
            git push origin HEAD:fix/batch-deferred-retry-rc197
          fi
