name: Verify premium ZIP import fix (RC198)
on:
  push:
    branches:
      - fix/zip-import-premium-ui-rc198
    paths:
      - scripts/apply_batch_rc198.cjs
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zip-import-premium-ui-rc198
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate updated batch interface
        run: node scripts/apply_batch_rc198.cjs
      - name: Check existing functionality and new ZIP behaviour without paid cloud calls
        run: |
          node tests/library_rc195.cjs
          node tests/save_import_rc164.cjs
          node tests/batch_rc196.cjs
          node tests/batch_rc197.cjs
          node tests/batch_rc198.cjs
      - name: Commit tested page to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Integrate mobile ZIP import and premium controls (RC198)"
            git push origin HEAD:fix/zip-import-premium-ui-rc198
          fi
