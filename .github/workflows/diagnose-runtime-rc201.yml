name: Diagnose Bass Studio page without paid analysis
on:
  push:
    branches:
      - diagnostic/platform-runtime-rc201
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostic/platform-runtime-rc201
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check live Render page and compare with GitHub
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 1 -fsSL --max-time 30 -w 'LIVE HTTP: %{http_code}; BYTES: %{size_download}; TYPE: %{content_type}\n' https://bass-stem-studio-app-z5ja.onrender.com/ -o /tmp/live_bass.html
          sha256sum /tmp/live_bass.html index.html
          if cmp -s /tmp/live_bass.html index.html; then echo 'PASS: Live page equals GitHub main release'; else echo 'WARNING: Live page differs from repository'; fi
          curl --retry 1 -fsSL --max-time 20 https://bass-stem-studio-app-z5ja.onrender.com/sw.js | head -c 180
          echo
      - name: Check page loads and opens Batch ZIP in headless Chrome
        run: |
          command -v google-chrome || command -v chromium
          node tests/runtime_smoke_rc201.cjs
