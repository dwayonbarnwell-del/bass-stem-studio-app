name: Integrate batch ZIP analysis (feature branch only)
on:
  push:
    branches:
      - feature/batch-zip-analysis-rc196
    paths:
      - scripts/apply_batch_rc196.cjs
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/batch-zip-analysis-rc196
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch existing app without replacing its other code
        run: node scripts/apply_batch_rc196.cjs
      - name: Check library and import logic (no cloud analysis)
        run: |
          node tests/library_rc195.cjs
          node tests/save_import_rc164.cjs
      - name: Commit integrated page to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Integrate batch ZIP UI and app analysis hooks"
            git push origin HEAD:feature/batch-zip-analysis-rc196
          fi
