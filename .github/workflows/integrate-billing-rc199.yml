name: Integrate Settings billing shortcuts
on:
  push:
    branches:
      - feature/rc199-payments-settings
    paths:
      - scripts/apply_billing_rc199.cjs
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rc199-payments-settings
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add the payment buttons without changing existing application functions
        run: node scripts/apply_billing_rc199.cjs
      - name: Commit validated main page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Integrate Payments & Billing links into Settings"
            git push origin HEAD:feature/rc199-payments-settings
          fi
